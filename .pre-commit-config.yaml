repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.0.285
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: local
    hooks:
      - id: akos-connector-policy
        name: AKOS connector policy gate
        entry: bash -c 'set -euo pipefail; test -n "${AKOS_POLICY_SHA256:-}" || { echo "AKOS_POLICY_SHA256 protected trust root is required" >&2; exit 1; }; cd genius/pro-code; python -m smithery_control_plane.runtime.connector_policy --validate smithery_control_plane/config/akos_connector_policy.json; python -m pytest tests/test_connector_policy.py tests/test_connector_gateway.py tests/test_connector_entrypoint_integration.py -q'
        language: system
        pass_filenames: false
        always_run: true
