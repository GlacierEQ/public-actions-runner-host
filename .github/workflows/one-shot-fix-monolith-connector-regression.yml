name: One-shot fix Monolith connector regression

on:
  push:
    branches:
      - evolve/monolith-connector-function-gate-20260808

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: evolve/monolith-connector-function-gate-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Update only the stale direct-command regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_specialized_monolith_runners.py')
          text = path.read_text(encoding='utf-8')
          old = '''    sequence = real_commands(result_path, "RunnerJob01")\n    assert len(sequence) == 13\n    assert any("scripts/validate_function_atlas.py" in command for command in sequence)\n    assert any("scripts/validate_category_heads.py" in command for command in sequence)\n'''
          new = '''    sequence = real_commands(result_path, "RunnerJob01")\n    assert len(sequence) == 15\n    assert any("scripts/validate_function_atlas.py" in command for command in sequence)\n    assert any("scripts/validate_connector_fabric.py" in command for command in sequence)\n    assert any("test_connector_fabric.py" in command for command in sequence)\n    assert any("scripts/validate_category_heads.py" in command for command in sequence)\n'''
          if text.count(old) != 1:
              raise SystemExit('expected stale regression block not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m pip install --disable-pip-version-check ruff==0.16.1
          ruff format tests/test_specialized_monolith_runners.py
          ruff check tests/test_specialized_monolith_runners.py
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' tests/test_specialized_monolith_runners.py | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Remove fixer and commit exact scope
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-fix-monolith-connector-regression.yml
          git add tests/test_specialized_monolith_runners.py
          git diff --cached --name-only | sort > /tmp/staged.txt
          printf '%s\n' \
            .github/workflows/one-shot-fix-monolith-connector-regression.yml \
            tests/test_specialized_monolith_runners.py | sort > /tmp/expected-staged.txt
          diff -u /tmp/expected-staged.txt /tmp/staged.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(runner): include connector commands in atlas regression'
          git push origin HEAD:evolve/monolith-connector-function-gate-20260808
