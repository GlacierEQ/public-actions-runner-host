name: One-shot category-head atlas gate proof

on:
  push:
    branches:
      - evolve/monolith-category-head-atlas-gate-20260808

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: evolve/monolith-category-head-atlas-gate-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile specialized atlas regression
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/test_specialized_monolith_runners.py")
          text = path.read_text(encoding="utf-8")

          fixture_anchor = '        "tests/test_function_atlas.py": "import unittest\\n",\n'
          fixture_add = (
              fixture_anchor
              + '        "scripts/validate_category_heads.py": "print(\\\"validated\\\")\\n",\n'
              + '        "tests/test_category_heads.py": "import unittest\\n",\n'
              + '        "catalog/category_heads.json": "{}\\n",\n'
              + '        "foundations/category-heads.md": "# Category Heads\\n",\n'
          )
          if text.count(fixture_anchor) != 1:
              raise SystemExit("atlas fixture anchor changed unexpectedly")
          text = text.replace(fixture_anchor, fixture_add, 1)

          gates_old = '''    assert result["validated_gates"] == [
              "core-function-atlas",
              "monolith-command-atlas",
          ]
          '''
          gates_new = '''    assert result["validated_gates"] == [
              "core-function-atlas",
              "category-head-hierarchy",
              "monolith-command-atlas",
          ]
          '''
          if text.count(gates_old) != 1:
              raise SystemExit("atlas validated_gates assertion changed unexpectedly")
          text = text.replace(gates_old, gates_new, 1)

          if text.count("    assert len(sequence) == 11\n") != 1:
              raise SystemExit("atlas command-count assertion changed unexpectedly")
          text = text.replace(
              "    assert len(sequence) == 11\n",
              "    assert len(sequence) == 13\n",
              1,
          )

          sequence_anchor = '''    assert any("scripts/validate_function_atlas.py" in command for command in sequence)
          '''
          sequence_add = sequence_anchor + '''    assert any("scripts/validate_category_heads.py" in command for command in sequence)
          assert any("test_category_heads.py" in command for command in sequence)
          '''
          if text.count(sequence_anchor) != 1:
              raise SystemExit("atlas sequence assertion anchor changed unexpectedly")
          text = text.replace(sequence_anchor, sequence_add, 1)

          path.write_text(text, encoding="utf-8")

      - name: Remove one-shot workflow before verification
        run: git rm .github/workflows/one-shot-category-head-atlas-gate-proof.yml

      - name: Run complete public action face verification
        run: bash scripts/ci/public-action-face-ci.sh

      - name: Commit proven regression only after full CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "casey"
          git config user.email "GLACIER.EQUILIBRIUM@GMAIL.COM"
          git add tests/test_specialized_monolith_runners.py
          git commit -m "test: lock category-head atlas execution contract"
          git push origin HEAD:evolve/monolith-category-head-atlas-gate-20260808
