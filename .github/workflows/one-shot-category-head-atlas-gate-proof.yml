name: One-shot category-head atlas gate proof

on:
  push:
    branches:
      - evolve/monolith-category-head-atlas-gate-20260808

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: evolve/monolith-category-head-atlas-gate-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile specialized atlas regression
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/test_specialized_monolith_runners.py")
          text = path.read_text(encoding="utf-8")

          fixture_anchor = '        "tests/test_function_atlas.py": "import unittest\\n",\n'
          fixture_add = (
              fixture_anchor
              + '        "scripts/validate_category_heads.py": "print(\\\"validated\\\")\\n",\n'
              + '        "tests/test_category_heads.py": "import unittest\\n",\n'
              + '        "catalog/category_heads.json": "{}\\n",\n'
              + '        "foundations/category-heads.md": "# Category Heads\\n",\n'
          )
          if text.count(fixture_anchor) != 1:
              raise SystemExit("atlas fixture anchor changed unexpectedly")
          text = text.replace(fixture_anchor, fixture_add, 1)

          lines = text.splitlines()
          gate_candidates = [
              index
              for index, line in enumerate(lines)
              if line.strip() == 'assert result["validated_gates"] == ['
              and index + 1 < len(lines)
              and lines[index + 1].strip() == '"core-function-atlas",'
          ]
          if len(gate_candidates) != 1:
              raise SystemExit(
                  f"expected one atlas validated_gates block, found {len(gate_candidates)}"
              )
          gate_start = gate_candidates[0]
          gate_end = next(
              index
              for index in range(gate_start + 1, len(lines))
              if lines[index].strip() == "]"
          )
          indent = lines[gate_start][: len(lines[gate_start]) - len(lines[gate_start].lstrip())]
          lines[gate_start : gate_end + 1] = [
              f'{indent}assert result["validated_gates"] == [',
              f'{indent}    "core-function-atlas",',
              f'{indent}    "category-head-hierarchy",',
              f'{indent}    "monolith-command-atlas",',
              f"{indent}]",
          ]

          count_candidates = [
              index
              for index, line in enumerate(lines)
              if line.strip() == "assert len(sequence) == 11"
          ]
          if len(count_candidates) != 1:
              raise SystemExit(
                  f"expected one atlas command-count assertion, found {len(count_candidates)}"
              )
          lines[count_candidates[0]] = (
              lines[count_candidates[0]].replace("== 11", "== 13")
          )

          sequence_candidates = [
              index
              for index, line in enumerate(lines)
              if 'scripts/validate_function_atlas.py' in line
              and "assert any" in line
          ]
          if len(sequence_candidates) != 1:
              raise SystemExit(
                  f"expected one function-atlas sequence assertion, found {len(sequence_candidates)}"
              )
          sequence_index = sequence_candidates[0]
          sequence_indent = lines[sequence_index][
              : len(lines[sequence_index]) - len(lines[sequence_index].lstrip())
          ]
          lines[sequence_index + 1 : sequence_index + 1] = [
              f'{sequence_indent}assert any("scripts/validate_category_heads.py" in command for command in sequence)',
              f'{sequence_indent}assert any("test_category_heads.py" in command for command in sequence)',
          ]

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Remove one-shot workflow before verification
        run: git rm .github/workflows/one-shot-category-head-atlas-gate-proof.yml

      - name: Run complete public action face verification
        run: bash scripts/ci/public-action-face-ci.sh

      - name: Commit proven regression only after full CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "casey"
          git config user.email "GLACIER.EQUILIBRIUM@GMAIL.COM"
          git add tests/test_specialized_monolith_runners.py
          git commit -m "test: lock category-head atlas execution contract"
          git push origin HEAD:evolve/monolith-category-head-atlas-gate-20260808
