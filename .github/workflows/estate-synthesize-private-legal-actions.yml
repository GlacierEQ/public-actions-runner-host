name: Estate synthesize private legal actions

on:
  push:
    branches:
      - synth/private-legal-validation-actions-20260807
    paths:
      - .github/workflows/estate-synthesize-private-legal-actions.yml

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fresh synthesis branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply nonconflicting PR 83 delta and bound conflicts
        shell: bash
        run: |
          set -euo pipefail
          expected_main=0f30e73e4932611d1b9e631db7b267bb2dc9064f
          expected_source=b78410c34999d31015dad67305f83df36b36c686
          source_base=8f2e50c2934b4ccf29f758b933cdbe78ef32b67a
          git merge-base --is-ancestor "$expected_main" HEAD
          git fetch --no-tags origin legal/private-validation-actions-v2-20260804
          test "$(git rev-parse FETCH_HEAD)" = "$expected_source"
          git diff --binary "$source_base" "$expected_source" -- \
            config/action-face-actions.json \
            docs/PRIVATE_LEGAL_VALIDATION_ACTIONS.md \
            domains/code/actions.json \
            domains/code/adapters/casey_legal_mcp_validate.py \
            domains/code/adapters/monolith_company_registry_validate.py \
            domains/code/adapters/monolith_legal_live_validate.py \
            domains/code/schemas/casey-legal-mcp-job.schema.json \
            domains/code/schemas/casey-legal-mcp-result.schema.json \
            domains/code/schemas/monolith-company-registry-job.schema.json \
            domains/code/schemas/monolith-company-registry-result.schema.json \
            domains/code/schemas/monolith-legal-live-job.schema.json \
            domains/code/schemas/monolith-legal-live-result.schema.json \
            registry/actions-index.json \
            scripts/action_face_plan.py \
            scripts/apex_catalog_runner.py \
            tests/test_domain_registry.py \
            tests/test_private_legal_validation_actions.py > /tmp/pr83.patch
          git apply --3way --index /tmp/pr83.patch || true
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          expected=(
            domains/code/actions.json
            registry/actions-index.json
            scripts/action_face_plan.py
            scripts/apex_catalog_runner.py
            tests/test_domain_registry.py
          )
          test "${#conflicts[@]}" -eq "${#expected[@]}"
          printf '%s\n' "${conflicts[@]}" | sort > /tmp/conflicts.actual
          printf '%s\n' "${expected[@]}" | sort > /tmp/conflicts.expected
          diff -u /tmp/conflicts.expected /tmp/conflicts.actual
          git checkout --ours -- "${expected[@]}"

      - name: Resolve five conflicts semantically on current main
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          actions_path = Path("domains/code/actions.json")
          actions = json.loads(actions_path.read_text())
          additions = {
              "code.monolith.validate-legal-live-reconciliation": {
                  "status": "active",
                  "adapter": "monolith_legal_live_validate",
                  "adapterPath": "domains/code/adapters/monolith_legal_live_validate.py",
                  "targetRepository": "GlacierEQ/monolith",
                  "tokenProfile": "private-source-read",
                  "jobSchema": "monolith-legal-live-job-v1",
                  "jobSchemaPath": "domains/code/schemas/monolith-legal-live-job.schema.json",
                  "resultSchema": "monolith-legal-live-result-v1",
                  "resultSchemaPath": "domains/code/schemas/monolith-legal-live-result.schema.json",
                  "approvalPolicy": "owner-dispatched",
                  "executionMode": "source-read-only",
                  "receiptNamespace": "code",
                  "concurrencyKeyTemplate": "code:{targetRepository}",
                  "legacyAliases": ["monolith-validate-legal-live-reconciliation"],
              },
              "code.monolith.validate-company-engineered-registry": {
                  "status": "active",
                  "adapter": "monolith_company_registry_validate",
                  "adapterPath": "domains/code/adapters/monolith_company_registry_validate.py",
                  "targetRepository": "GlacierEQ/monolith",
                  "tokenProfile": "private-source-read",
                  "jobSchema": "monolith-company-registry-job-v1",
                  "jobSchemaPath": "domains/code/schemas/monolith-company-registry-job.schema.json",
                  "resultSchema": "monolith-company-registry-result-v1",
                  "resultSchemaPath": "domains/code/schemas/monolith-company-registry-result.schema.json",
                  "approvalPolicy": "owner-dispatched",
                  "executionMode": "source-read-only",
                  "receiptNamespace": "code",
                  "concurrencyKeyTemplate": "code:{targetRepository}",
                  "legacyAliases": ["monolith-validate-company-engineered-registry"],
              },
              "code.casey-legal-mcp.validate-v2": {
                  "status": "active",
                  "adapter": "casey_legal_mcp_validate",
                  "adapterPath": "domains/code/adapters/casey_legal_mcp_validate.py",
                  "targetRepository": "GlacierEQ/casey-legal-mcp-server",
                  "tokenProfile": "private-source-read",
                  "jobSchema": "casey-legal-mcp-job-v1",
                  "jobSchemaPath": "domains/code/schemas/casey-legal-mcp-job.schema.json",
                  "resultSchema": "casey-legal-mcp-result-v1",
                  "resultSchemaPath": "domains/code/schemas/casey-legal-mcp-result.schema.json",
                  "approvalPolicy": "owner-dispatched",
                  "executionMode": "source-read-only",
                  "receiptNamespace": "code",
                  "concurrencyKeyTemplate": "code:{targetRepository}",
                  "legacyAliases": ["casey-legal-mcp-validate-v2"],
              },
          }
          for key, value in additions.items():
              if key in actions["actions"]:
                  raise SystemExit(f"unexpected preexisting action: {key}")
              actions["actions"][key] = value
          actions_path.write_text(json.dumps(actions, indent=2) + "\n")

          index_path = Path("registry/actions-index.json")
          index = json.loads(index_path.read_text())
          canonical = {
              key: {"domain": "code", "status": "active", "catalog": "domains/code/actions.json"}
              for key in additions
          }
          aliases = {
              "monolith-validate-legal-live-reconciliation": "code.monolith.validate-legal-live-reconciliation",
              "monolith-validate-company-engineered-registry": "code.monolith.validate-company-engineered-registry",
              "casey-legal-mcp-validate-v2": "code.casey-legal-mcp.validate-v2",
          }
          for key, value in canonical.items():
              if key in index["canonicalActions"]:
                  raise SystemExit(f"unexpected preexisting canonical action: {key}")
              index["canonicalActions"][key] = value
          for alias, target in aliases.items():
              if alias in index["aliases"]:
                  raise SystemExit(f"unexpected preexisting alias: {alias}")
              index["aliases"][alias] = {
                  "canonicalAction": target,
                  "status": "temporary",
                  "removeAfter": "canonical-action-face-ingress-verified",
              }
          index_path.write_text(json.dumps(index, indent=2) + "\n")

          plan_path = Path("scripts/action_face_plan.py")
          plan = plan_path.read_text()
          adapter_anchor = '    "master-strand-extinction": "audit",\n'
          adapter_insert = (
              '    "monolith_legal_live_validate": "test",\n'
              '    "monolith_company_registry_validate": "test",\n'
              '    "casey_legal_mcp_validate": "test",\n'
          )
          if "monolith_legal_live_validate" in plan:
              raise SystemExit("private legal adapter mapping unexpectedly preexists")
          if plan.count(adapter_anchor) != 1:
              raise SystemExit("action-face adapter anchor drifted")
          plan = plan.replace(adapter_anchor, adapter_anchor + adapter_insert)
          immutable_anchor = '    "code.monolith.validate-atlases",\n'
          immutable_insert = (
              '    "code.monolith.validate-legal-live-reconciliation",\n'
              '    "code.monolith.validate-company-engineered-registry",\n'
              '    "code.casey-legal-mcp.validate-v2",\n'
          )
          if plan.count(immutable_anchor) != 1:
              raise SystemExit("immutable-source anchor drifted")
          plan = plan.replace(immutable_anchor, immutable_anchor + immutable_insert)
          plan_path.write_text(plan)

          runner_path = Path("scripts/apex_catalog_runner.py")
          runner = runner_path.read_text()
          atlas = '''    if action == "code.monolith.validate-atlases":\n        from domains.code.adapters.monolith_atlas_validate import run\n\n        return run(plan, workspace, result_path)\n'''
          dispatch = '''    if action == "code.monolith.validate-legal-live-reconciliation":\n        from domains.code.adapters.monolith_legal_live_validate import run\n\n        return run(plan, workspace, result_path)\n    if action == "code.monolith.validate-company-engineered-registry":\n        from domains.code.adapters.monolith_company_registry_validate import run\n\n        return run(plan, workspace, result_path)\n    if action == "code.casey-legal-mcp.validate-v2":\n        from domains.code.adapters.casey_legal_mcp_validate import run\n\n        return run(plan, workspace, result_path)\n'''
          if "code.casey-legal-mcp.validate-v2" in runner:
              raise SystemExit("private legal dispatch unexpectedly preexists")
          if runner.count(atlas) != 1:
              raise SystemExit("specialized runner anchor drifted")
          runner = runner.replace(atlas, atlas + dispatch)
          runner_path.write_text(runner)

          test_path = Path("tests/test_domain_registry.py")
          tests = test_path.read_text()
          test_anchor = '        "code.monolith.validate-atlases",\n'
          test_insert = (
              '        "code.monolith.validate-legal-live-reconciliation",\n'
              '        "code.monolith.validate-company-engineered-registry",\n'
              '        "code.casey-legal-mcp.validate-v2",\n'
          )
          if tests.count(test_anchor) < 1:
              raise SystemExit("domain-registry test anchor drifted")
          tests = tests.replace(test_anchor, test_anchor + test_insert, 1)
          test_path.write_text(tests)
          PY
          git add domains/code/actions.json registry/actions-index.json \
            scripts/action_face_plan.py scripts/apex_catalog_runner.py \
            tests/test_domain_registry.py
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Run repository-native action-face verification
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/public-action-face-ci.sh

      - name: Commit verified synthesis and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/estate-synthesize-private-legal-actions.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "synthesize(runner): replay private legal validation actions on current main"
          git push origin HEAD:synth/private-legal-validation-actions-20260807
