name: APEX Master Grove Bootstrap Bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - jobs/master-grove-verify-*.json

permissions:
  contents: read

concurrency:
  group: master-grove-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.author_association == 'OWNER' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APEX_EXECUTION_REPO: GlacierEQ/public-actions-runner-host
      APEX_EXPECTED_VISIBILITY: public
      APEX_CONTROL_REPO: GlacierEQ/llm-runner-teams

    steps:
      - name: Checkout canonical public action face
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize owner PR ingress
        id: authorize
        run: python3 scripts/action_face_authorize.py

      - name: Assert canonical public execution face
        id: identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/action_face_guard.py

      - name: Validate cataloged Master Grove envelope
        id: plan
        continue-on-error: true
        run: python3 scripts/action_face_pull_request_plan.py

      - name: Enforce exact bounded action
        if: steps.plan.outcome == 'success'
        run: |
          test "${{ steps.plan.outputs.pillar }}" = "C"
          test "${{ steps.plan.outputs.action }}" = "master-grove-verify"
          test "${{ steps.plan.outputs.source_repo }}" = "GlacierEQ/Z-BACKUP-aspen-grove-operator-v7"
          test "${{ steps.plan.outputs.source_ref }}" = "main"

      - name: Require existing bootstrap bridge credential
        if: steps.plan.outcome == 'success'
        id: credential
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          test -n "$GH_PAT" || { echo "existing GH_PAT bridge credential is not bound" >&2; exit 1; }
          echo "::add-mask::$GH_PAT"

      - name: Create immutable private claim
        if: steps.plan.outcome == 'success' && steps.credential.outcome == 'success'
        id: claim
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          JOB_ID: ${{ steps.plan.outputs.job_id }}
          PUBLIC_RUN_ID: ${{ github.run_id }}
          PUBLIC_RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLIC_RUNNER_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          token = os.environ['GH_PAT']
          job_id = os.environ['JOB_ID']
          plan = json.loads(Path('.apex-plan.json').read_text(encoding='utf-8'))
          canonical = json.dumps(plan, sort_keys=True, separators=(',', ':')).encode()
          claim = {
              'schema_version': 'apex.claim.v1',
              'job_id': job_id,
              'pillar': plan['pillar'],
              'action': plan['action'],
              'source_repo': plan['source_repo'],
              'source_ref': plan['source_ref'],
              'payload_sha256': hashlib.sha256(canonical).hexdigest(),
              'claimed_at': datetime.now(timezone.utc).isoformat(),
              'execution_repo': 'GlacierEQ/public-actions-runner-host',
              'public_run_id': os.environ['PUBLIC_RUN_ID'],
              'public_run_attempt': os.environ['PUBLIC_RUN_ATTEMPT'],
              'public_runner_sha': os.environ['PUBLIC_RUNNER_SHA'],
              'credential_mode': 'legacy_bootstrap_pat'
          }
          path = f'claims/{job_id}.json'
          url = f'https://api.github.com/repos/GlacierEQ/llm-runner-teams/contents/{path}'
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          req = urllib.request.Request(url + '?ref=main', headers=headers)
          try:
              urllib.request.urlopen(req)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          else:
              raise SystemExit(f'immutable claim already exists: {path}')
          body = json.dumps({
              'message': f'claim: {job_id}',
              'content': base64.b64encode((json.dumps(claim, indent=2) + '\n').encode()).decode(),
              'branch': 'main'
          }).encode()
          req = urllib.request.Request(url, data=body, headers={**headers, 'Content-Type': 'application/json'}, method='PUT')
          with urllib.request.urlopen(req) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f'claim publication failed: HTTP {response.status}')
          print('immutable private claim created')
          PY

      - name: Checkout exact private Master Grove source
        if: steps.claim.outcome == 'success'
        id: checkout
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: GlacierEQ/Z-BACKUP-aspen-grove-operator-v7
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: workload
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact private workload commit
        if: steps.checkout.outcome == 'success'
        id: bind
        continue-on-error: true
        run: |
          python3 scripts/action_face_bind_checkout.py \
            --plan .apex-plan.json \
            --workspace workload

      - name: Execute Master Grove verification privately
        if: steps.bind.outcome == 'success'
        id: runner
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (
            cd workload
            npm ci --ignore-scripts --no-audit --no-fund
            npm test
          ) >"$RUNNER_TEMP/master-grove-verify.log" 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test "$code" -eq 0

      - name: Publish immutable detailed private result
        if: always() && steps.plan.outcome == 'success' && steps.claim.outcome == 'success'
        id: publish
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          JOB_ID: ${{ steps.plan.outputs.job_id }}
          SOURCE_SHA: ${{ steps.bind.outputs.resolved_source_sha }}
          TEST_EXIT_CODE: ${{ steps.runner.outputs.exit_code }}
          RUNNER_OUTCOME: ${{ steps.runner.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          BIND_OUTCOME: ${{ steps.bind.outcome }}
          PUBLIC_RUN_ID: ${{ github.run_id }}
          PUBLIC_RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLIC_RUNNER_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          token = os.environ['GH_PAT']
          job_id = os.environ['JOB_ID']
          log_path = Path(os.environ['RUNNER_TEMP']) / 'master-grove-verify.log'
          detail = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''
          detail = detail[-50000:]
          status = 'success' if os.environ.get('RUNNER_OUTCOME') == 'success' and os.environ.get('TEST_EXIT_CODE') == '0' else 'failure'
          result = {
              'schema_version': 'apex.result.v1',
              'job_id': job_id,
              'pillar': 'C',
              'action': 'master-grove-verify',
              'status': status,
              'published_at': datetime.now(timezone.utc).isoformat(),
              'execution_repo': 'GlacierEQ/public-actions-runner-host',
              'public_run_id': os.environ['PUBLIC_RUN_ID'],
              'public_run_attempt': os.environ['PUBLIC_RUN_ATTEMPT'],
              'public_runner_sha': os.environ['PUBLIC_RUNNER_SHA'],
              'source_repo': 'GlacierEQ/Z-BACKUP-aspen-grove-operator-v7',
              'source_ref': 'main',
              'resolved_source_sha': os.environ.get('SOURCE_SHA', ''),
              'credential_mode': 'legacy_bootstrap_pat',
              'checkout_outcome': os.environ.get('CHECKOUT_OUTCOME', ''),
              'bind_outcome': os.environ.get('BIND_OUTCOME', ''),
              'runner_outcome': os.environ.get('RUNNER_OUTCOME', ''),
              'test_exit_code': os.environ.get('TEST_EXIT_CODE', ''),
              'detail_sha256': hashlib.sha256(detail.encode()).hexdigest(),
              'detail': detail
          }
          path = f'results/{job_id}.json'
          url = f'https://api.github.com/repos/GlacierEQ/llm-runner-teams/contents/{path}'
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          req = urllib.request.Request(url + '?ref=main', headers=headers)
          try:
              urllib.request.urlopen(req)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          else:
              raise SystemExit(f'immutable result already exists: {path}')
          body = json.dumps({
              'message': f'result: {job_id} {status}',
              'content': base64.b64encode((json.dumps(result, indent=2) + '\n').encode()).decode(),
              'branch': 'main'
          }).encode()
          req = urllib.request.Request(url, data=body, headers={**headers, 'Content-Type': 'application/json'}, method='PUT')
          with urllib.request.urlopen(req) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f'result publication failed: HTTP {response.status}')
          print(f'private result published: {status}')
          PY

      - name: Enforce completed verification and receipt
        if: >-
          always() &&
          (steps.plan.outcome != 'success' ||
           steps.credential.outcome != 'success' ||
           steps.claim.outcome != 'success' ||
           steps.checkout.outcome != 'success' ||
           steps.bind.outcome != 'success' ||
           steps.runner.outcome != 'success' ||
           steps.publish.outcome != 'success')
        run: exit 1
