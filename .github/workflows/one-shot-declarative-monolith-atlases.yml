name: One-shot declarative Monolith atlas surfaces

on:
  push:
    branches:
      - evolve/monolith-declarative-atlas-surfaces-20260808

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: evolve/monolith-declarative-atlas-surfaces-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Convert optional atlas gates to declarative registry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          import re

          adapter = Path('domains/code/adapters/monolith_atlas_validate.py')
          text = adapter.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'expected block exactly once: {old[:80]!r}')
              text = text.replace(old, new)

          replace_once(
              '''LEGAL_REQUIRED_PATHS = (\n    "scripts/validate_legal_case.py",\n    "tests/test_legal_case.py",\n    "domains/legal_case.md",\n    "status/LEGAL_CASE_ATLAS.md",\n)\nCATEGORY_REQUIRED_PATHS = (\n''',
              '''LEGAL_REQUIRED_PATHS = (\n    "scripts/validate_legal_case.py",\n    "tests/test_legal_case.py",\n    "domains/legal_case.md",\n    "status/LEGAL_CASE_ATLAS.md",\n)\nLAB_HIRE_REQUIRED_PATHS = (\n    "scripts/validate_lab_hire_atlas.py",\n    "tests/test_lab_hire_atlas.py",\n    "domains/lab_hire_stamps.md",\n    "status/LAB_HIRE_DOMAIN_ATLAS.md",\n)\nCATEGORY_REQUIRED_PATHS = (\n''',
          )

          marker = '''CATEGORY_REQUIRED_PATHS = (\n    "scripts/validate_category_heads.py",\n    "tests/test_category_heads.py",\n    "catalog/category_heads.json",\n    "foundations/category-heads.md",\n)\n'''
          registry = marker + '''\nOPTIONAL_SURFACES = (\n    {\n        "key": "connectors",\n        "label": "connector-fabric",\n        "required_paths": CONNECTOR_REQUIRED_PATHS,\n        "compile_targets": (\n            "scripts/validate_connector_fabric.py",\n            "tests/test_connector_fabric.py",\n        ),\n        "validator": "scripts/validate_connector_fabric.py",\n        "test_pattern": "test_connector_fabric.py",\n        "gate": "connector-fabric-atlas",\n    },\n    {\n        "key": "memory",\n        "label": "memory-aspen",\n        "required_paths": MEMORY_REQUIRED_PATHS,\n        "compile_targets": (\n            "scripts/validate_memory_aspen.py",\n            "tests/test_memory_aspen.py",\n        ),\n        "validator": "scripts/validate_memory_aspen.py",\n        "test_pattern": "test_memory_aspen.py",\n        "gate": "memory-aspen-atlas",\n    },\n    {\n        "key": "legal",\n        "label": "legal-case",\n        "required_paths": LEGAL_REQUIRED_PATHS,\n        "compile_targets": (\n            "scripts/validate_legal_case.py",\n            "tests/test_legal_case.py",\n        ),\n        "validator": "scripts/validate_legal_case.py",\n        "test_pattern": "test_legal_case.py",\n        "gate": "legal-case-atlas",\n    },\n    {\n        "key": "lab_hire",\n        "label": "lab-hire",\n        "required_paths": LAB_HIRE_REQUIRED_PATHS,\n        "compile_targets": (\n            "scripts/validate_lab_hire_atlas.py",\n            "tests/test_lab_hire_atlas.py",\n        ),\n        "validator": "scripts/validate_lab_hire_atlas.py",\n        "test_pattern": "test_lab_hire_atlas.py",\n        "gate": "lab-hire-atlas",\n    },\n    {\n        "key": "category_heads",\n        "label": "category-head",\n        "required_paths": CATEGORY_REQUIRED_PATHS,\n        "compile_targets": (\n            "scripts/validate_category_heads.py",\n            "tests/test_category_heads.py",\n        ),\n        "validator": "scripts/validate_category_heads.py",\n        "test_pattern": "test_category_heads.py",\n        "gate": "category-head-hierarchy",\n    },\n)\n'''
          replace_once(marker, registry)

          state_pattern = re.compile(
              r'def connector_surface_state\(workspace: Path\) -> str:\n.*?\n\ndef commands\(',
              re.S,
          )
          state_replacement = '''def _surface_state(workspace: Path, required_paths: tuple[str, ...]) -> str:\n    present = [path for path in required_paths if (workspace / path).is_file()]\n    if not present:\n        return "absent"\n    if len(present) == len(required_paths):\n        return "complete"\n    return "partial"\n\n\ndef connector_surface_state(workspace: Path) -> str:\n    return _surface_state(workspace, CONNECTOR_REQUIRED_PATHS)\n\n\ndef memory_surface_state(workspace: Path) -> str:\n    return _surface_state(workspace, MEMORY_REQUIRED_PATHS)\n\n\ndef legal_surface_state(workspace: Path) -> str:\n    return _surface_state(workspace, LEGAL_REQUIRED_PATHS)\n\n\ndef lab_hire_surface_state(workspace: Path) -> str:\n    return _surface_state(workspace, LAB_HIRE_REQUIRED_PATHS)\n\n\ndef category_surface_state(workspace: Path) -> str:\n    return _surface_state(workspace, CATEGORY_REQUIRED_PATHS)\n\n\ndef commands('''
          text, count = state_pattern.subn(state_replacement, text, count=1)
          if count != 1:
              raise SystemExit('failed to replace surface-state block')

          command_pattern = re.compile(r'def commands\(.*?\n    return sequence\n\n\ndef _copy_regular_file', re.S)
          command_replacement = '''def commands(\n    result_path: Path,\n    job_id: str,\n    include_category_heads: bool = True,\n    include_connectors: bool = True,\n    include_memory: bool = True,\n    include_legal: bool = True,\n    include_lab_hire: bool = True,\n) -> list[list[str]]:\n    venv = result_path.resolve().parent / f"venv-{job_id}"\n    python = venv / "bin" / "python"\n    enabled = {\n        "connectors": include_connectors,\n        "memory": include_memory,\n        "legal": include_legal,\n        "lab_hire": include_lab_hire,\n        "category_heads": include_category_heads,\n    }\n    compile_targets = [\n        "scripts/validate_function_atlas.py",\n        "tests/test_function_atlas.py",\n    ]\n    for surface in OPTIONAL_SURFACES:\n        if enabled[surface["key"]]:\n            compile_targets.extend(surface["compile_targets"])\n\n    sequence: list[list[str]] = [\n        [sys.executable, "-m", "venv", str(venv)],\n        [\n            str(python),\n            "-m",\n            "pip",\n            "install",\n            "--disable-pip-version-check",\n            "--only-binary=:all:",\n            "pytest==8.4.1",\n        ],\n        [str(python), "-m", "py_compile", *compile_targets],\n        [str(python), "scripts/validate_function_atlas.py"],\n        [\n            str(python),\n            "-m",\n            "unittest",\n            "discover",\n            "-s",\n            "tests",\n            "-p",\n            "test_function_atlas.py",\n        ],\n    ]\n\n    for surface in OPTIONAL_SURFACES:\n        if not enabled[surface["key"]]:\n            continue\n        sequence.extend(\n            [\n                [str(python), surface["validator"]],\n                [\n                    str(python),\n                    "-m",\n                    "unittest",\n                    "discover",\n                    "-s",\n                    "tests",\n                    "-p",\n                    surface["test_pattern"],\n                ],\n            ]\n        )\n\n    sequence.extend(\n        [\n            [str(python), COMMAND_ATLAS_GENERATOR, "--check"],\n            [str(python), "scripts/query_monolith.py", "summary", "--format", "json"],\n            [\n                str(python),\n                "scripts/query_monolith.py",\n                "repos",\n                "--has-evidence",\n                "--format",\n                "json",\n                "--limit",\n                "0",\n            ],\n            [\n                str(python),\n                "scripts/query_monolith.py",\n                "actions",\n                "--priority",\n                "P0",\n                "--format",\n                "json",\n            ],\n            [str(python), "scripts/query_monolith.py", "domains", "--format", "json"],\n            [\n                str(python),\n                "-m",\n                "pytest",\n                "-q",\n                "tests/test_monolith_command_atlas.py",\n                "tests/test_query_monolith.py",\n            ],\n        ]\n    )\n    return sequence\n\n\ndef _copy_regular_file'''
          text, count = command_pattern.subn(command_replacement, text, count=1)
          if count != 1:
              raise SystemExit('failed to replace commands block')

          run_pattern = re.compile(
              r'        connector_state = connector_surface_state\(workspace_root\)\n.*?        steps: list\[dict\] = \[\]',
              re.S,
          )
          run_replacement = '''        surface_states: dict[str, str] = {}\n        enabled_surfaces: dict[str, bool] = {}\n        for surface in OPTIONAL_SURFACES:\n            state = _surface_state(workspace_root, surface["required_paths"])\n            surface_states[surface["key"]] = state\n            if state == "partial":\n                missing = [\n                    path\n                    for path in surface["required_paths"]\n                    if not (workspace_root / path).is_file()\n                ]\n                return catalog.write_result(\n                    plan,\n                    result_path,\n                    "blocked",\n                    reason=(\n                        f"partial {surface['label']} surface is not verifiable; missing: "\n                        + ", ".join(missing)\n                    ),\n                )\n            enabled_surfaces[surface["key"]] = state == "complete"\n\n        sequence = commands(\n            result_path,\n            str(plan["job_id"]),\n            enabled_surfaces["category_heads"],\n            enabled_surfaces["connectors"],\n            enabled_surfaces["memory"],\n            enabled_surfaces["legal"],\n            enabled_surfaces["lab_hire"],\n        )\n        steps: list[dict] = []'''
          text, count = run_pattern.subn(run_replacement, text, count=1)
          if count != 1:
              raise SystemExit('failed to replace run surface block')

          gates_pattern = re.compile(
              r'    gates = \["core-function-atlas"\]\n.*?    gates.append\("monolith-command-atlas"\)',
              re.S,
          )
          gates_replacement = '''    gates = ["core-function-atlas"]\n    for surface in OPTIONAL_SURFACES:\n        if enabled_surfaces[surface["key"]]:\n            gates.append(surface["gate"])\n    gates.append("monolith-command-atlas")'''
          text, count = gates_pattern.subn(gates_replacement, text, count=1)
          if count != 1:
              raise SystemExit('failed to replace gate assembly block')

          adapter.write_text(text, encoding='utf-8')

          schema = Path('domains/code/schemas/monolith-atlases-result.schema.json')
          schema_text = schema.read_text(encoding='utf-8')
          if schema_text.count('"steps": {"type": "array", "maxItems": 20}') != 1:
              raise SystemExit('unexpected result step bound')
          if schema_text.count('"maxItems": 6,\n      "items": {"type": "string", "maxLength": 64}') != 1:
              raise SystemExit('unexpected result gate bound')
          schema_text = schema_text.replace(
              '"steps": {"type": "array", "maxItems": 20}',
              '"steps": {"type": "array", "maxItems": 22}',
          ).replace(
              '"maxItems": 6,\n      "items": {"type": "string", "maxLength": 64}',
              '"maxItems": 7,\n      "items": {"type": "string", "maxLength": 64}',
          )
          schema.write_text(schema_text, encoding='utf-8')

          tests = Path('tests/test_monolith_atlas_optional_category.py')
          t = tests.read_text(encoding='utf-8')
          t = t.replace('assert len(sequence) == 19', 'assert len(sequence) == 21', 1)
          needle = '    assert any("test_legal_case.py" in command for command in sequence)\n'
          if t.count(needle) < 1:
              raise SystemExit('default legal assertion missing')
          t = t.replace(
              needle,
              needle
              + '    assert any("scripts/validate_lab_hire_atlas.py" in command for command in sequence)\n'
              + '    assert any("test_lab_hire_atlas.py" in command for command in sequence)\n',
              1,
          )
          t = t.replace('adapter.commands(result, "CoreOnly01", False, False, False, False)', 'adapter.commands(result, "CoreOnly01", False, False, False, False, False)')
          t = t.replace('adapter.commands(result, "ConnectorGate01", False, True, False, False)', 'adapter.commands(result, "ConnectorGate01", False, True, False, False, False)')
          t = t.replace('adapter.commands(result, "MemoryGate01", False, False, True, False)', 'adapter.commands(result, "MemoryGate01", False, False, True, False, False)')
          t = t.replace('adapter.commands(result, "LegalGate01", False, False, False, True)', 'adapter.commands(result, "LegalGate01", False, False, False, True, False)')
          legal_test_end = '''    assert not any(\n        "scripts/validate_category_heads.py" in command for command in sequence\n    )\n\n\ndef test_connector_surface_state_distinguishes_absent_partial_complete(\n'''
          lab_command_test = '''    assert not any(\n        "scripts/validate_category_heads.py" in command for command in sequence\n    )\n\n\ndef test_commands_support_lab_hire_without_other_optional_gates(tmp_path: Path) -> None:\n    result = tmp_path / "result.json"\n\n    sequence = adapter.commands(result, "LabHireGate01", False, False, False, False, True)\n\n    assert len(sequence) == 13\n    assert any("scripts/validate_lab_hire_atlas.py" in command for command in sequence)\n    assert any("test_lab_hire_atlas.py" in command for command in sequence)\n    assert not any("scripts/validate_connector_fabric.py" in command for command in sequence)\n    assert not any("scripts/validate_memory_aspen.py" in command for command in sequence)\n    assert not any("scripts/validate_legal_case.py" in command for command in sequence)\n    assert not any("scripts/validate_category_heads.py" in command for command in sequence)\n\n\ndef test_connector_surface_state_distinguishes_absent_partial_complete(\n'''
          if t.count(legal_test_end) != 1:
              raise SystemExit('legal command test boundary missing')
          t = t.replace(legal_test_end, lab_command_test)
          category_marker = '''def test_category_surface_state_distinguishes_absent_partial_complete(\n'''
          lab_state_test = '''def test_lab_hire_surface_state_distinguishes_absent_partial_complete(\n    tmp_path: Path,\n) -> None:\n    assert adapter.lab_hire_surface_state(tmp_path) == "absent"\n\n    first = tmp_path / adapter.LAB_HIRE_REQUIRED_PATHS[0]\n    first.parent.mkdir(parents=True, exist_ok=True)\n    first.write_text("fixture\\n", encoding="utf-8")\n    assert adapter.lab_hire_surface_state(tmp_path) == "partial"\n\n    for relative in adapter.LAB_HIRE_REQUIRED_PATHS[1:]:\n        path = tmp_path / relative\n        path.parent.mkdir(parents=True, exist_ok=True)\n        path.write_text("fixture\\n", encoding="utf-8")\n    assert adapter.lab_hire_surface_state(tmp_path) == "complete"\n\n\ndef test_category_surface_state_distinguishes_absent_partial_complete(\n'''
          if t.count(category_marker) != 1:
              raise SystemExit('category state marker missing')
          t = t.replace(category_marker, lab_state_test)
          partial_category_marker = '''def test_partial_category_surface_blocks_before_execution(\n'''
          partial_lab_test = '''def test_partial_lab_hire_surface_blocks_before_execution(\n    tmp_path: Path,\n    monkeypatch,\n) -> None:\n    workspace = tmp_path / "workspace"\n    workspace.mkdir()\n    for relative in adapter.CORE_REQUIRED_PATHS:\n        path = workspace / relative\n        path.parent.mkdir(parents=True, exist_ok=True)\n        path.write_text("fixture\\n", encoding="utf-8")\n    partial = workspace / adapter.LAB_HIRE_REQUIRED_PATHS[0]\n    partial.parent.mkdir(parents=True, exist_ok=True)\n    partial.write_text("fixture\\n", encoding="utf-8")\n\n    monkeypatch.setenv("APEX_RESOLVED_SOURCE_SHA", "a" * 40)\n    monkeypatch.setattr(adapter, "open_checkout", lambda *_args, **_kwargs: _checkout_for(workspace))\n    monkeypatch.setattr(adapter, "build_environment", lambda *_args, **_kwargs: {})\n    monkeypatch.setattr(adapter, "attest_checkout", lambda *_args, **_kwargs: _attestation())\n\n    result_path = tmp_path / "result.json"\n    assert adapter.run(_plan("PartialLabHire01"), workspace, result_path) == 2\n    payload = json.loads(result_path.read_text(encoding="utf-8"))\n    assert payload["status"] == "blocked"\n    assert "partial lab-hire surface" in payload["reason"]\n\n\ndef test_partial_category_surface_blocks_before_execution(\n'''
          if t.count(partial_category_marker) != 1:
              raise SystemExit('partial category marker missing')
          t = t.replace(partial_category_marker, partial_lab_test)
          tests.write_text(t, encoding='utf-8')

          specialized = Path('tests/test_specialized_monolith_runners.py')
          s = specialized.read_text(encoding='utf-8')
          if s.count('assert len(sequence) == 19') != 1:
              raise SystemExit('specialized command-count assertion unexpected')
          s = s.replace('assert len(sequence) == 19', 'assert len(sequence) == 21', 1)
          needle = '    assert any("test_legal_case.py" in command for command in sequence)\n'
          if s.count(needle) != 1:
              raise SystemExit('specialized legal assertion unexpected')
          s = s.replace(
              needle,
              needle
              + '    assert any("scripts/validate_lab_hire_atlas.py" in command for command in sequence)\n'
              + '    assert any("test_lab_hire_atlas.py" in command for command in sequence)\n',
              1,
          )
          specialized.write_text(s, encoding='utf-8')
          PY

          python -m pip install --disable-pip-version-check ruff==0.16.1 pytest==9.1.1
          ruff format domains/code/adapters/monolith_atlas_validate.py tests/test_monolith_atlas_optional_category.py tests/test_specialized_monolith_runners.py
          ruff check domains/code/adapters/monolith_atlas_validate.py tests/test_monolith_atlas_optional_category.py tests/test_specialized_monolith_runners.py
          python -m pytest -q tests/test_monolith_atlas_optional_category.py tests/test_specialized_monolith_runners.py
          python -m json.tool domains/code/schemas/monolith-atlases-result.schema.json >/dev/null
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' \
            domains/code/adapters/monolith_atlas_validate.py \
            domains/code/schemas/monolith-atlases-result.schema.json \
            tests/test_monolith_atlas_optional_category.py \
            tests/test_specialized_monolith_runners.py | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Remove evolver and commit exact scope
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-declarative-monolith-atlases.yml
          git add \
            domains/code/adapters/monolith_atlas_validate.py \
            domains/code/schemas/monolith-atlases-result.schema.json \
            tests/test_monolith_atlas_optional_category.py \
            tests/test_specialized_monolith_runners.py
          git diff --cached --name-only | sort > /tmp/staged.txt
          printf '%s\n' \
            .github/workflows/one-shot-declarative-monolith-atlases.yml \
            domains/code/adapters/monolith_atlas_validate.py \
            domains/code/schemas/monolith-atlases-result.schema.json \
            tests/test_monolith_atlas_optional_category.py \
            tests/test_specialized_monolith_runners.py | sort > /tmp/expected-staged.txt
          diff -u /tmp/expected-staged.txt /tmp/staged.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'evolve(runner): make Monolith atlas surfaces declarative'
          git push origin HEAD:evolve/monolith-declarative-atlas-surfaces-20260808
