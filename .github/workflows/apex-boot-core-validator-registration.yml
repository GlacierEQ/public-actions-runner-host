name: APEX Boot-Core Validator Registration

on:
  push:
    branches:
      - apex/boot-core-exact-validator-20260815
    paths:
      - scripts/apply_apex_boot_core_validator_registration.py
      - .github/workflows/apex-boot-core-validator-registration.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apex/boot-core-exact-validator-20260815
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic registration patch
        run: python scripts/apply_apex_boot_core_validator_registration.py

      - name: Show exact patch
        run: git diff --check && git diff -- scripts/action_face_catalog_runner.py registry/actions-index.json config/token-profiles.json tests/test_domain_registry.py

      - name: Commit registration if changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "registration already applied"
            exit 0
          fi
          git config user.name "GlacierEQ APEX Runner"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/action_face_catalog_runner.py registry/actions-index.json config/token-profiles.json tests/test_domain_registry.py
          git commit -m "Register exact APEX boot-core validator"
          git push origin HEAD:apex/boot-core-exact-validator-20260815
