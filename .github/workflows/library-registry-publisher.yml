name: Library Registry Publisher

on:
  push:
    branches: [main]
    paths:
      - "jobs/library-publish-*.json"

permissions:
  id-token: write
  contents: read

concurrency:
  group: library-registry-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public execution plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Resolve immutable publish request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jobs < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^jobs/library-publish-[A-Za-z0-9._-]+\.json$' || true)
          if [ "${#jobs[@]}" -ne 1 ]; then
            echo "Expected exactly one Library publish job in this commit; found ${#jobs[@]}" >&2
            exit 64
          fi
          source_ref="$(python3 - "${jobs[0]}" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          value = str(data.get('source_ref', ''))
          if not re.fullmatch(r'[0-9a-f]{40}', value):
              raise SystemExit('source_ref must be an exact 40-character SHA')
          print(value)
          PY
          )"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "job_path=${jobs[0]}" >> "$GITHUB_OUTPUT"

      - name: Mint repo-scoped Library write token
        id: token
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/keymaster_oidc_token.py \
            --repository GlacierEQ/library-of-links \
            --permission contents=write \
            --operation library-registry-rebuild

      - name: Checkout exact private Library revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GlacierEQ/library-of-links
          ref: ${{ steps.request.outputs.source_ref }}
          token: ${{ steps.token.outputs.token }}
          path: workload
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact private source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C workload rev-parse HEAD)" = "${{ steps.request.outputs.source_ref }}"
          test -z "$(git -C workload status --porcelain --untracked-files=no)"

      - name: Verify source and deterministic rebuild
        shell: bash
        env:
          GITHUB_REPOSITORY: GlacierEQ/library-of-links
          GITHUB_SHA: ${{ steps.request.outputs.source_ref }}
        run: |
          set -euo pipefail
          cd workload
          bash scripts/ci/verify.sh

      - name: Materialize generated registry projections
        shell: bash
        run: |
          set -euo pipefail
          cd workload
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          python3 scripts/rebuild_registry.py
          git diff --check -- registry/index.json registry/top_shelf.json
          git diff --stat -- registry/index.json registry/top_shelf.json

      - name: Atomically publish projections with exact-head guard
        shell: bash
        env:
          GITHUB_INSTALLATION_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          python3 scripts/library_registry_publish.py \
            --workspace workload \
            --source-ref "${{ steps.request.outputs.source_ref }}" \
            --message "Rebuild knowledge registry"

      - name: Revoke repo-scoped Library token
        if: always() && steps.token.outcome == 'success'
        shell: bash
        env:
          GITHUB_INSTALLATION_TOKEN: ${{ steps.token.outputs.token }}
        run: python3 scripts/revoke_github_installation_token.py
