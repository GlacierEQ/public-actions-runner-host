name: Estate clean synthesis artifacts

on:
  push:
    branches:
      - synth/private-legal-validation-actions-20260807
    paths:
      - .github/workflows/estate-clean-synthesis-artifacts.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out synthesis branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove generated Python caches and add durable ignores
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          .pytest_cache/
          .ruff_cache/
          .mypy_cache/
          .venv/
          venv/
          EOF

      - name: Re-run action-face CI without bytecode artifacts
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          bash scripts/ci/public-action-face-ci.sh

      - name: Commit clean verified synthesis
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git rm .github/workflows/estate-clean-synthesis-artifacts.yml
          git add -A
          if git diff --cached --name-only | grep -E '(^|/)(__pycache__/|.*\.py[co]$)'; then
            echo 'generated Python cache artifact remains staged' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(runner): exclude generated Python caches"
          git push origin HEAD:synth/private-legal-validation-actions-20260807
