name: Spiral Engine CI

on:
  workflow_call:
    inputs:
      repo_name:
        type: string
        required: true
      language:
        type: string
        default: python
        required: false
      node_version:
        type: string
        default: "22"
        required: false
      python_version:
        type: string
        default: "3.12"
        required: false
      go_version:
        type: string
        default: "1.23"
        required: false
      run_tests:
        type: boolean
        default: true
      run_lint:
        type: boolean
        default: true
      run_security:
        type: boolean
        default: true
      run_build:
        type: boolean
        default: false
      deploy:
        type: boolean
        default: false
    secrets:
      DEPLOY_TOKEN:
        required: false
      CODECOV_TOKEN:
        required: false

jobs:
  python-quality:
    name: "🐍 Python · Lint · Type · Test"
    runs-on: [self-hosted, linux]
    if: inputs.language == 'python' && inputs.run_lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          [ -f requirements-dev.txt ] && pip install -r requirements-dev.txt || true

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy . --ignore-missing-imports

  python-test:
    name: "🐍 Python · Test"
    runs-on: [self-hosted, linux]
    if: inputs.language == 'python' && inputs.run_tests
    needs: [python-quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov
          [ -f requirements.txt ] && pip install -r requirements.txt || true

      - name: Pytest
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  typescript-quality:
    name: "📦 TypeScript · Lint · Type · Build"
    runs-on: [self-hosted, linux]
    if: inputs.language == 'typescript' && inputs.run_lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  typescript-test:
    name: "📦 TypeScript · Test"
    runs-on: [self-hosted, linux]
    if: inputs.language == 'typescript' && inputs.run_tests
    needs: [typescript-quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  go-quality:
    name: "🐹 Go · Vet · Lint · Test"
    runs-on: [self-hosted, linux]
    if: inputs.language == 'go' && inputs.run_lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        run: go tool cover -func=coverage.out

  security:
    name: "🔒 Security Scan"
    runs-on: [self-hosted, linux]
    if: inputs.run_security
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan
        run: |
          echo "🔍 Scanning for secrets..."
          ! grep -rn "ghp_\|sk_live\|AKIA\|password\s*=" \
            --include="*.py" --include="*.ts" --include="*.js" \
            --include="*.go" --include="*.env" . 2>/dev/null || {
            echo "⚠️ Potential secrets found"
            exit 1
          }
          echo "✅ Clean"

      - name: Dependency audit
        run: |
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            pip install pip-audit 2>/dev/null && pip-audit || echo "pip-audit skipped"
          fi
          if [ -f "package-lock.json" ]; then
            npm audit --audit-level=high 2>/dev/null || true
          fi

  build:
    name: "🔨 Build"
    runs-on: [self-hosted, linux]
    if: inputs.run_build
    needs: [python-quality, typescript-quality, go-quality, security]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          if [ -f "Makefile" ]; then make build
          elif [ -f "pyproject.toml" ]; then pip install build && python -m build
          elif [ -f "package.json" ]; then npm run build
          else echo "No build system"
          fi

  notify:
    name: "📊 Status"
    runs-on: [self-hosted, linux]
    needs: [python-quality, python-test, typescript-quality, typescript-test, go-quality, security]
    if: always()
    steps:
      - name: Report
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  📦 ${{ inputs.repo_name }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🐍 Python Lint:  ${{ needs.python-quality.result || 'skipped' }}"
          echo "  🐍 Python Test:  ${{ needs.python-test.result || 'skipped' }}"
          echo "  📦 TS Lint:      ${{ needs.typescript-quality.result || 'skipped' }}"
          echo "  📦 TS Test:      ${{ needs.typescript-test.result || 'skipped' }}"
          echo "  🐹 Go:           ${{ needs.go-quality.result || 'skipped' }}"
          echo "  🔒 Security:     ${{ needs.security.result || 'skipped' }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
