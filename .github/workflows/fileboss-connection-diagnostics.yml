name: FILEBOSS Connection Diagnostics — Public Runner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fileboss-connection-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint FILEBOSS-scoped read/status token
        id: workload-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APEX_RUNNER_APP_CLIENT_ID }}
          private-key: ${{ secrets.APEX_RUNNER_APP_PRIVATE_KEY }}
          owner: GlacierEQ
          repositories: FILEBOSS
          permission-contents: read
          permission-statuses: write

      - name: Checkout exact FILEBOSS main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: GlacierEQ/FILEBOSS
          ref: main
          token: ${{ steps.workload-token.outputs.token }}
          path: FILEBOSS
          fetch-depth: 1
          persist-credentials: false

      - name: Capture exact workload head
        id: workload
        shell: bash
        run: |
          set -euo pipefail
          cd FILEBOSS
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Verify diagnostics executor
        working-directory: FILEBOSS
        run: python -m unittest discover -s tests -p 'test_checker.py' -v

      - name: Run unauthenticated diagnostics
        id: diagnostic
        working-directory: FILEBOSS
        shell: bash
        run: |
          set +e
          python checker.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -f reports/connection-diagnostics.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/connection-diagnostics.json').read_text())
          assert report['schema'] == 'glaciereq.connection-diagnostics.v2'
          assert report['mode'] == 'unauthenticated'
          assert report['state'] == 'DIAGNOSTICS_COMPLETE'
          assert report['summary']['declared'] == 7
          assert report['summary']['authenticated'] == 0
          assert report['summary']['action_capable'] == 0
          assert all('secret' not in json.dumps(row).lower() for row in report['claims'])
          print(json.dumps(report['summary'], sort_keys=True))
          PY

      - name: Publish exact-SHA diagnostic status
        env:
          GH_TOKEN: ${{ steps.workload-token.outputs.token }}
          HEAD_SHA: ${{ steps.workload.outputs.head }}
          EXIT_CODE: ${{ steps.diagnostic.outputs.exit_code }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EXIT_CODE" == "0" ]]; then
            state=success
            description="FILEBOSS unauthenticated connector diagnostics completed"
          else
            state=failure
            description="FILEBOSS diagnostics completed with blocked endpoint(s)"
          fi
          python3 - "$state" "$description" <<'PY' > /tmp/status.json
          import json, os, sys
          print(json.dumps({
              "state": sys.argv[1],
              "target_url": os.environ["RUN_URL"],
              "description": sys.argv[2],
              "context": "FILEBOSS/connections-diagnostics-public-runner",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/GlacierEQ/FILEBOSS/statuses/$HEAD_SHA" \
            --data-binary @/tmp/status.json

      - name: Upload diagnostics receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fileboss-connection-diagnostics-${{ steps.workload.outputs.head }}
          path: FILEBOSS/reports/connection-diagnostics.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce diagnostic reachability result
        env:
          EXIT_CODE: ${{ steps.diagnostic.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXIT_CODE" = "0"
