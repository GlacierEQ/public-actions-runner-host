name: Supermemory Space Cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (no writes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      SM_KEY: sm_tdpNTGLMbKRFCDjruaivZr_MhyVWbyEkrOhqKYpCWxiZyojMYMjqmlKiHtLUtcFsFybJujCmwxZJYpjZQIqvtNw
      BASE: https://api.supermemory.ai
      DRY_RUN: ${{ inputs.dry_run || 'false' }}

    steps:
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Step 1 — Audit case_test space
        run: |
          echo "=== STEP 1: Auditing case_test ==="
          RESPONSE=$(curl -s "$BASE/v3/documents?containerTag=case_test&limit=50" \
            -H "Authorization: Bearer $SM_KEY")
          COUNT=$(echo "$RESPONSE" | jq '.documents | length')
          echo "case_test doc count: $COUNT"
          if [ "$COUNT" -eq "0" ]; then
            echo "✅ case_test is EMPTY — safe to delete manually in console"
          else
            echo "⚠️  case_test has $COUNT docs:"
            echo "$RESPONSE" | jq '[.documents[] | {id: .id, title: .title}]'
          fi

      - name: Step 2 — Merge sm_project_administrative_entities_ into clean space
        run: |
          echo "=== STEP 2: Auditing trailing-underscore duplicate ==="
          RESPONSE=$(curl -s "$BASE/v3/documents?containerTag=sm_project_administrative_entities_&limit=50" \
            -H "Authorization: Bearer $SM_KEY")
          COUNT=$(echo "$RESPONSE" | jq '.documents | length')
          echo "Trailing-underscore doc count: $COUNT"
          if [ "$COUNT" -gt "0" ]; then
            echo "$RESPONSE" | jq -r '.documents[].id' | while read DOC_ID; do
              if [ "$DRY_RUN" = "false" ]; then
                curl -s -X PATCH "$BASE/v3/documents/$DOC_ID" \
                  -H "Authorization: Bearer $SM_KEY" \
                  -H "Content-Type: application/json" \
                  -d '{"containerTag": "sm_project_administrative_entities"}'
                echo "  ✅ Migrated $DOC_ID"
              else
                echo "  [DRY RUN] Would migrate $DOC_ID"
              fi
            done
          finame: Supermemory Space Cleanup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run only (recommended)
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      SM_KEY: ${{ secrets.SUPERMEMORY_API_KEY }}
      BASE: https://api.supermemory.ai
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Validate secret and tools
        shell: bash
        run: |
          set -euo pipefail
          command -v jq >/dev/null
          test -n "${SM_KEY:-}" || { echo 'Missing SUPERMEMORY_API_KEY repository secret' >&2; exit 1; }

      - name: Audit case_test without modifying it
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors "$BASE/v3/documents?containerTag=case_test&limit=50" -H "Authorization: Bearer $SM_KEY")
          count=$(jq '.documents // [] | length' <<<"$response")
          echo "case_test document count: $count"
          jq '[.documents[]? | {id, title}]' <<<"$response"

      - name: Move duplicate administrative-entities documents
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors "$BASE/v3/documents?containerTag=sm_project_administrative_entities_&limit=50" -H "Authorization: Bearer $SM_KEY")
          jq -r '.documents[]?.id' <<<"$response" | while IFS= read -r id; do
            if [ "${DRY_RUN:-true}" = true ]; then echo "[DRY RUN] Would move $id"; else
              curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors -X PATCH "$BASE/v3/documents/$id" -H "Authorization: Bearer $SM_KEY" -H 'Content-Type: application/json' --data '{"containerTag":"sm_project_administrative_entities"}' >/dev/null
              echo "Moved $id"
            fi
          done

      - name: Re-tag opaque session-log documents
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors "$BASE/v3/documents?containerTag=5k3ntRsaCJxZW4GG4GMe6a&limit=50" -H "Authorization: Bearer $SM_KEY")
          jq -r '.documents[]?.id' <<<"$response" | while IFS= read -r id; do
            if [ "${DRY_RUN:-true}" = true ]; then echo "[DRY RUN] Would re-tag $id"; else
              curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors -X PATCH "$BASE/v3/documents/$id" -H "Authorization: Bearer $SM_KEY" -H 'Content-Type: application/json' --data '{"containerTag":"kekoa-session-logs"}' >/dev/null
              echo "Re-tagged $id"
            fi
          done

      - name: Move default-space documents
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors "$BASE/v3/documents?containerTag=sm_project_default&limit=50" -H "Authorization: Bearer $SM_KEY")
          jq -r '.documents[]?.id' <<<"$response" | while IFS= read -r id; do
            if [ "${DRY_RUN:-true}" = true ]; then echo "[DRY RUN] Would move $id"; else
              curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors -X PATCH "$BASE/v3/documents/$id" -H "Authorization: Bearer $SM_KEY" -H 'Content-Type: application/json' --data '{"containerTag":"sm_project_memory_master"}' >/dev/null
              echo "Moved $id"
            fi
          done

      - name: Upsert stable routing rules
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n --arg content 'GlacierEQ APEX SPACE ROUTING RULES v1

Use apex-home for stable architecture and connector documentation.
Use apex-case for active 1FDV-23-0001009 work.
Use kekoa-session-logs for session logs.
Use evidence-vault for source-indexed evidence.
Use threat-intel for verified threat indicators and clearly labeled leads.
Use timestamp-forensics for timestamp and header analysis.
Use decision-engine for recommendations only; never auto-file, accuse, contact courts, or delete evidence.' '{customId:"apex-space-routing-rules-v1",content:$content,containerTag:"sm_project_memory_master",metadata:{source:"public-actions-runner-host",caseNumber:"1FDV-23-0001009",verificationLevel:"operational-rule",tags:["routing","token-saver","pointer-first"]}}')
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors -X POST "$BASE/v3/documents" -H "Authorization: Bearer $SM_KEY" -H 'Content-Type: application/json' --data "$payload" >/dev/null
          echo 'Routing rules upsert submitted.'


      - name: Step 3 — Re-tag 5k3ntRsaCJxZW4GG4GMe6a to kekoa-session-logs
        run: |
          echo "=== STEP 3: Re-tagging opaque space ==="
          RESPONSE=$(curl -s "$BASE/v3/documents?containerTag=5k3ntRsaCJxZW4GG4GMe6a&limit=50" \
            -H "Authorization: Bearer $SM_KEY")
          echo "$RESPONSE" | jq -r '.documents[].id' | while read DOC_ID; do
            if [ "$DRY_RUN" = "false" ]; then
              curl -s -X PATCH "$BASE/v3/documents/$DOC_ID" \
                -H "Authorization: Bearer $SM_KEY" \
                -H "Content-Type: application/json" \
                -d '{"containerTag": "kekoa-session-logs"}'
              echo "  ✅ Re-tagged $DOC_ID → kekoa-session-logs"
            else
              echo "  [DRY RUN] Would re-tag $DOC_ID → kekoa-session-logs"
            fi
          done

      - name: Step 4 — Move sm_project_default docs to sm_project_memory_master
        run: |
          echo "=== STEP 4: Cleaning sm_project_default ==="
          RESPONSE=$(curl -s "$BASE/v3/documents?containerTag=sm_project_default&limit=50" \
            -H "Authorization: Bearer $SM_KEY")
          echo "$RESPONSE" | jq -r '.documents[].id' | while read DOC_ID; do
            if [ "$DRY_RUN" = "false" ]; then
              curl -s -X PATCH "$BASE/v3/documents/$DOC_ID" \
                -H "Authorization: Bearer $SM_KEY" \
                -H "Content-Type: application/json" \
                -d '{"containerTag": "sm_project_memory_master"}'
              echo "  ✅ Moved $DOC_ID → sm_project_memory_master"
            else
              echo "  [DRY RUN] Would move $DOC_ID → sm_project_memory_master"
            fi
          done

      - name: Step 5 — Write space routing rules to memory_master
        run: |
          echo "=== STEP 5: Writing routing rules ==="
          if [ "$DRY_RUN" = "false" ]; then
            curl -s -X POST "$BASE/v3/documents" \
              -H "Authorization: Bearer $SM_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "content": "SPACE ROUTING RULES — GlacierEQ APEX\n\napex-home: APEX system intelligence. Stable docs, architecture refs, Supermemory docs, tool configs, blog imports, connector manifests. PERMANENT.\n\napex-case: Active live workspace for case 1FDV-23-0001009. Working drafts, todays filings, session outputs. Cleared periodically.\n\nkekoa-session-logs: Session transcripts, forensic logs, memory boot records.\n\nsm_project_kekoa_: Finalized Kekoa reunification docs.\n\nsm_project_evidences: Master evidence store — SHA-256 verified.\n\nROUTING:\n- New legal working doc → apex-case\n- Finalized legal doc → sm_project_kekoa_ or sm_project_evidences\n- System/tool/architecture doc → apex-home\n- Session transcript → kekoa-session-logs\n- Memory scripts/orchestration → sm_project_memory_master",
                "containerTag": "sm_project_memory_master",
                "dreaming": "instant"
              }'
            echo "✅ Routing rules written"
          else
            echo "[DRY RUN] Would write routing rules"
          fi

      - name: Cleanup Summary
        run: |
          echo "========================================"
          echo "SUPERMEMORY CLEANUP COMPLETE"
          echo "Operator: Casey Barton / GlacierEQ"
          echo "Date: $(date)"
          echo "Dry Run: $DRY_RUN"
          echo "========================================"
