name: Keymaster OIDC Admin Cutover

on:
  push:
    branches: [fix/keymaster-oidc-public-runner]
    paths:
      - .oidc-admin-trigger

permissions:
  id-token: write
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/keymaster-oidc-public-runner
          persist-credentials: false
          fetch-depth: 0
      - name: Mint one-run workflow patch token
        id: admin_token
        run: python3 scripts/keymaster_oidc_admin_push.py
      - name: Apply validated cutover
        run: python3 scripts/apply_oidc_cutover.py
      - name: Verify cutover
        run: |
          git diff --check
          python3 -m py_compile scripts/keymaster_oidc_token.py scripts/apply_oidc_cutover.py
          grep -q 'id-token: write' .github/workflows/apex-pillar-runner.yml
          ! grep -q 'secrets.APEX_RUNNER_APP_PRIVATE_KEY' .github/workflows/apex-pillar-runner.yml
          ! grep -q 'vars.APEX_RUNNER_APP_CLIENT_ID' .github/workflows/apex-pillar-runner.yml
      - name: Commit through Keymaster installation token
        env:
          PUSH_TOKEN: ${{ steps.admin_token.outputs.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/apex-pillar-runner.yml scripts/action_face_selftest.py tests/test_apex_job_ingress_exclusivity.py
          git commit -m 'auth: cut public runner over to Keymaster OIDC'
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/GlacierEQ/public-actions-runner-host.git"
          git push origin HEAD:fix/keymaster-oidc-public-runner
