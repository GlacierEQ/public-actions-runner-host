name: One-shot isolated catalog import repair

on:
  push:
    branches:
      - fix/isolated-catalog-runner-import-20260808

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/isolated-catalog-runner-import-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Repair isolated sibling imports and add exact regression
        shell: python
        run: |
          from pathlib import Path

          runner = Path("scripts/apex_catalog_runner.py")
          text = runner.read_text(encoding="utf-8")
          old = '''ROOT = Path(__file__).resolve().parents[1]
          if str(ROOT) not in sys.path:
              sys.path.insert(0, str(ROOT))
          '''
          new = '''SCRIPT_DIR = Path(__file__).resolve().parent
          ROOT = SCRIPT_DIR.parent
          for import_path in (str(ROOT), str(SCRIPT_DIR)):
              if import_path not in sys.path:
                  sys.path.insert(0, import_path)
          '''
          if old not in text:
              raise SystemExit("expected apex_catalog_runner import bootstrap not found")
          runner.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_isolated_catalog_runner_import.py")
          test_path.write_text(
              '''"""Regression for delegated catalog execution under the capability-minimized env."""

          from __future__ import annotations

          import subprocess
          import sys
          from pathlib import Path

          from workload_isolation import build_environment

          ROOT = Path(__file__).resolve().parents[1]


          def test_catalog_runner_imports_siblings_with_python_safe_path(tmp_path: Path) -> None:
              result_path = tmp_path / "result.json"
              environment = build_environment(result_path, "catalog-import-proof")

              process = subprocess.run(
                  [sys.executable, "scripts/apex_catalog_runner.py"],
                  cwd=ROOT,
                  env=environment,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=30,
                  check=False,
                  shell=False,
              )

              assert environment["PYTHONSAFEPATH"] == "1"
              assert process.returncode != 0
              assert "usage: apex_catalog_runner.py PLAN WORKSPACE RESULT" in process.stdout
              assert "ModuleNotFoundError" not in process.stdout
          ''',
              encoding="utf-8",
          )

          ci = Path("scripts/ci/public-action-face-ci.sh")
          ci_text = ci.read_text(encoding="utf-8")
          needle = "  tests/test_monolith_evolution_adapter.py\n"
          if ci_text.count(needle) != 2:
              raise SystemExit("public action CI owned/format lists changed unexpectedly")
          ci_text = ci_text.replace(
              needle,
              "  tests/test_isolated_catalog_runner_import.py\n" + needle,
          )
          ci.write_text(ci_text, encoding="utf-8")

      - name: Remove one-shot workflow before verification
        run: git rm .github/workflows/one-shot-isolated-catalog-import-repair.yml

      - name: Run complete public action face verification
        run: bash scripts/ci/public-action-face-ci.sh

      - name: Require bounded repair scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test -n "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 3
          printf '%s\n' "$changed" | grep -q 'scripts/apex_catalog_runner.py'
          printf '%s\n' "$changed" | grep -q 'scripts/ci/public-action-face-ci.sh'
          printf '%s\n' "$changed" | grep -q 'tests/test_isolated_catalog_runner_import.py'

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "casey"
          git config user.email "GLACIER.EQUILIBRIUM@GMAIL.COM"
          git add scripts/apex_catalog_runner.py scripts/ci/public-action-face-ci.sh tests/test_isolated_catalog_runner_import.py
          git commit -m "fix: preserve catalog runner imports under isolated env"
          git push origin HEAD:fix/isolated-catalog-runner-import-20260808
