name: Legal Brief Pipeline

on:
  push:
    paths:
      - '**.tex'
      - '**.sty'
      - '**.bib'
  workflow_dispatch:
    inputs:
      tex_file:
        description: 'Main .tex file to compile (relative path)'
        required: false
        default: 'main.tex'
      case_name:
        description: 'Case name for Notion/Supabase tagging'
        required: false
        default: ''
  repository_dispatch:
    types: [overleaf-sync]

permissions:
  contents: read

jobs:
  compile-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Compile LaTeX to Verified PDF Artifact
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Find main TeX file
        id: find_tex
        env:
          INPUT_TEX_FILE: ${{ inputs.tex_file }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path.cwd().resolve()
          requested = (os.environ.get("INPUT_TEX_FILE") or "").strip()
          candidate: Path | None = None
          if requested:
              resolved = (root / requested).resolve()
              if root in resolved.parents and resolved.is_file() and resolved.suffix == ".tex":
                  candidate = resolved
          if candidate is None and (root / "main.tex").is_file():
              candidate = (root / "main.tex").resolve()
          if candidate is None:
              found = sorted(
                  p for p in root.rglob("*.tex")
                  if "node_modules" not in p.parts and ".git" not in p.parts and not p.is_symlink()
              )
              if not found:
                  raise SystemExit("No .tex source file found")
              candidate = found[0].resolve()

          rel = candidate.relative_to(root)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tex_file={rel.as_posix()}\n")
              out.write(f"tex_dir={rel.parent.as_posix()}\n")
              out.write(f"tex_base={candidate.stem}\n")
          PY

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install Tectonic from immutable verified release
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 755 "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-gnu.tar.gz"
          echo "875fbbc9ab48560d7776088c608e0beee49197b57ab4a2f6c5385b2c661c842f  /tmp/tectonic.tar.gz" | sha256sum --check --strict -
          tar -xzf /tmp/tectonic.tar.gz -C "$HOME/.local/bin" tectonic
          chmod 0755 "$HOME/.local/bin/tectonic"
          rm -f /tmp/tectonic.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compile LaTeX and stage bounded brief bundle
        id: compile
        env:
          TEX_DIR: ${{ steps.find_tex.outputs.tex_dir }}
          TEX_BASE: ${{ steps.find_tex.outputs.tex_base }}
          CASE_NAME: ${{ inputs.case_name }}
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$TEX_DIR"
            tectonic -X compile "${TEX_BASE}.tex" --outdir ./output 2>&1 | tee compile.log
          )
          pdf_file="${TEX_DIR}/output/${TEX_BASE}.pdf"
          test -f "$pdf_file"
          word_count="$(pdftotext "$pdf_file" - 2>/dev/null | wc -w | tr -d ' ' || echo 0)"
          install -d -m 700 .brief-staging
          cp "$pdf_file" .brief-staging/brief.pdf
          PDF_FILE=".brief-staging/brief.pdf" WORD_COUNT="$word_count" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          pdf = Path(os.environ["PDF_FILE"])
          raw = pdf.read_bytes()
          if len(raw) > 50 * 1024 * 1024:
              raise SystemExit("compiled PDF exceeds 50 MB ceiling")
          metadata = {
              "pdf_name": f"{os.environ['TEX_BASE']}.pdf",
              "word_count": int(os.environ.get("WORD_COUNT") or 0),
              "pdf_bytes": len(raw),
              "pdf_sha256": hashlib.sha256(raw).hexdigest(),
              "case_name": os.environ.get("CASE_NAME", ""),
          }
          Path(".brief-staging/metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload compiled brief artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legal-brief-${{ github.run_id }}-${{ github.run_attempt }}
          path: .brief-staging/
          if-no-files-found: error
          retention-days: 7

  publish-brief:
    needs: compile-pdf
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Publish Verified Brief Metadata and Storage
    permissions:
      contents: read

    steps:
      - name: Checkout publisher script without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/legal_brief_publish.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Download compiled brief artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: legal-brief-${{ github.run_id }}-${{ github.run_attempt }}
          path: .brief-staging

      - name: Install pinned analytics dependency
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: duckdb==1.2.1

      - name: Publish brief to Supabase, Notion, and MotherDuck
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: python3 scripts/legal_brief_publish.py --staging-dir .brief-staging
