name: Public Runner Team Contract

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/**"
      - "config/action-face-actions.json"
      - "config/public-runner-team.json"
      - "domains/**"
      - "registry/**"
      - "scripts/action_face_*.py"
      - "scripts/apex_catalog_runner.py"
      - "scripts/public_runner_team_guard.py"
      - "scripts/workload_isolation.py"
      - "security/RUNNER_HARDENING_RECEIPT_2026-08-03.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "config/action-face-actions.json"
      - "config/public-runner-team.json"
      - "domains/**"
      - "registry/**"
      - "scripts/action_face_*.py"
      - "scripts/apex_catalog_runner.py"
      - "scripts/public_runner_team_guard.py"
      - "scripts/workload_isolation.py"
      - "security/RUNNER_HARDENING_RECEIPT_2026-08-03.md"
  workflow_dispatch:

concurrency:
  group: runner-team-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-public-runner-team:
    name: Verify public runner team boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public action face
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enforce runner policy
        run: python3 scripts/public_runner_team_guard.py
