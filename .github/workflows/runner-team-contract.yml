name: Public Runner Team Contract

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/**"
      - "config/public-runner-team.json"
      - "scripts/public_runner_team_guard.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "config/public-runner-team.json"
      - "scripts/public_runner_team_guard.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-runner-team:
    name: Verify public runner team boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public action face
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enforce runner policy
        run: python3 scripts/public_runner_team_guard.py
