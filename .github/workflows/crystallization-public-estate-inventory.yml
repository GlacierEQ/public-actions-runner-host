name: Crystallization Public Estate Inventory

on:
  push:
    branches: [main]
    paths:
      - 'scripts/crystallization_public_estate_inventory.py'
      - '.github/workflows/crystallization-public-estate-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crystallization-public-estate-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public execution plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Build complete public owner registry and walk every Git tree
        id: scan
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/crystallization_public_estate_inventory.py \
            --owner GlacierEQ \
            --workers 8 \
            --output-dir crystallization

      - name: Validate registry schema and scope truth
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('crystallization/public-estate-registry.json').read_text())
          summary = json.loads(Path('crystallization/public-estate-summary.json').read_text())
          assert registry['public_only'] is True
          assert summary['public_only'] is True
          assert registry['repository_count'] == registry['profile_public_repos']
          assert summary['repository_count'] == registry['repository_count']
          assert summary['registry_digest'] == registry['registry_digest']
          assert registry['completion_claim_allowed'] is False
          assert summary['completion_claim_allowed'] is False
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Upload exact public registry artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crystallization-public-estate-registry
          path: |
            crystallization/public-estate-registry.json
            crystallization/public-estate-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit deterministic registry projection
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add crystallization/public-estate-registry.json crystallization/public-estate-summary.json
          if git diff --cached --quiet; then
            echo 'Public estate registry already matches current GitHub state.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'inventory: refresh complete public Crystallization registry'
          git push origin HEAD:main

      - name: Refuse partial Phase-0 completion
        if: always()
        run: |
          if [[ '${{ steps.scan.outcome }}' != 'success' ]]; then
            echo 'Public Phase-0 inventory remains incomplete. Registry was preserved with explicit UNKNOWN/error states.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('crystallization/public-estate-summary.json').read_text())
          assert summary['phase0_complete'] is True
          assert summary['statuses']['UNKNOWN'] == 0
          assert summary['tree_errors'] == 0
          print('PUBLIC_PHASE0_COMPLETE')
          PY
