name: APEX Private Estate Non-Regression Reusable

on:
  workflow_call:
    inputs:
      workload_repo:
        required: true
        type: string
      workload_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public runner face
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Probe GitHub App configuration
        id: config
        env:
          APP_CLIENT_ID: ${{ vars.APEX_RUNNER_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APEX_RUNNER_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          configured=true
          missing=()
          if [[ -z "$APP_CLIENT_ID" ]]; then configured=false; missing+=(APEX_RUNNER_APP_CLIENT_ID); fi
          if [[ -z "$APP_PRIVATE_KEY" ]]; then configured=false; missing+=(APEX_RUNNER_APP_PRIVATE_KEY); fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          if [[ ${#missing[@]} -gt 0 ]]; then
            printf 'missing=%s\n' "$(IFS=,; echo "${missing[*]}")" >> "$GITHUB_OUTPUT"
            {
              echo "## APEX private estate watchdog"
              echo
              echo "- Workload: ${{ inputs.workload_repo }}"
              echo "- State: BLOCKED_CONFIGURATION"
              echo "- Missing runner configuration: $(IFS=,; echo "${missing[*]}")"
              echo "- No private workload was read and no capability verdict was emitted."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mint one-repository workload token
        if: steps.config.outputs.configured == 'true'
        id: workload-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APEX_RUNNER_APP_CLIENT_ID }}
          private-key: ${{ secrets.APEX_RUNNER_APP_PRIVATE_KEY }}
          owner: GlacierEQ
          repositories: ${{ inputs.workload_repo }}
          permission-contents: read
          permission-statuses: write

      - name: Checkout enforcement implementation
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: GlacierEQ/apex-control-plane
          ref: main
          path: apex-control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout private workload
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.workload_repo }}
          ref: ${{ inputs.workload_ref }}
          token: ${{ steps.workload-token.outputs.token }}
          path: workload
          fetch-depth: 2
          persist-credentials: false

      - name: Run non-regression against exact private head
        if: steps.config.outputs.configured == 'true'
        id: enforce
        shell: bash
        run: |
          set -uo pipefail
          cd workload
          head="$(git rev-parse HEAD)"
          base="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)"
          set +e
          python ../apex-control/.github/actions/apex-non-regression/enforce.py \
            --base "$base" \
            --head "$head" \
            > ../apex-private-non-regression.json 2> ../apex-private-non-regression.err
          status=$?
          set -e
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat ../apex-private-non-regression.json
          if [[ -s ../apex-private-non-regression.err ]]; then cat ../apex-private-non-regression.err >&2; fi
          exit 0

      - name: Publish exact-SHA commit status
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.workload-token.outputs.token }}
          WORKLOAD_REPO: ${{ inputs.workload_repo }}
          HEAD_SHA: ${{ steps.enforce.outputs.head }}
          EXIT_CODE: ${{ steps.enforce.outputs.exit_code }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EXIT_CODE" == "0" ]]; then
            state=success
            description="APEX capability non-regression passed"
          else
            state=failure
            description="APEX capability contraction/corruption detected"
          fi
          python3 - "$state" "$description" <<'PY' > /tmp/status.json
          import json, os, sys
          print(json.dumps({
              "state": sys.argv[1],
              "target_url": os.environ["RUN_URL"],
              "description": sys.argv[2],
              "context": "APEX/estate-non-regression",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$WORKLOAD_REPO/statuses/$HEAD_SHA" \
            --data-binary @/tmp/status.json

      - name: Upload bounded enforcement receipt
        if: always() && steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-estate-non-regression
          path: |
            apex-private-non-regression.json
            apex-private-non-regression.err
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce result after status publication
        if: steps.config.outputs.configured == 'true'
        shell: bash
        env:
          EXIT_CODE: ${{ steps.enforce.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "$EXIT_CODE" = "0"
