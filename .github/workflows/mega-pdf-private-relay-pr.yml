name: MEGA-PDF Private Relay PR Trigger

on:
  pull_request:
    branches: [main]
    paths:
      - "triggers/mega-pdf-function-genome.json"
      - ".github/workflows/mega-pdf-private-relay-core.yml"
      - ".github/workflows/mega-pdf-private-relay-pr.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: mega-pdf-private-relay-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  relay:
    uses: ./.github/workflows/mega-pdf-private-relay-core.yml
    with:
      source_ref: ebccf699a43c18c73fb98187a1be0ee74b72389d
