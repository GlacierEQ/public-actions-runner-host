name: MEGA-PDF Private Verification Relay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mega-pdf-private-relay.yml"
      - ".github/workflows/mega-pdf-private-relay-core.yml"
      - "triggers/mega-pdf-function-genome.json"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact private MEGA-PDF commit SHA to verify
        required: true
        default: ebccf699a43c18c73fb98187a1be0ee74b72389d
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: mega-pdf-private-relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  relay:
    uses: ./.github/workflows/mega-pdf-private-relay-core.yml
    with:
      source_ref: ${{ inputs.source_ref || 'ebccf699a43c18c73fb98187a1be0ee74b72389d' }}
