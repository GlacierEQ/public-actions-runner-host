name: One-shot add Monolith Legal gate

on:
  push:
    branches:
      - evolve/monolith-legal-function-gate-20260808

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: evolve/monolith-legal-function-gate-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Add bounded optional Legal Case surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected replacement block exactly once')
              p.write_text(text.replace(old, new), encoding='utf-8')

          adapter = 'domains/code/adapters/monolith_atlas_validate.py'
          replace_once(
              adapter,
              '''MEMORY_REQUIRED_PATHS = (\n    "scripts/validate_memory_aspen.py",\n    "tests/test_memory_aspen.py",\n    "domains/memory_aspen.md",\n    "status/MEMORY_ASPEN_ATLAS.md",\n)\nCATEGORY_REQUIRED_PATHS = (\n''',
              '''MEMORY_REQUIRED_PATHS = (\n    "scripts/validate_memory_aspen.py",\n    "tests/test_memory_aspen.py",\n    "domains/memory_aspen.md",\n    "status/MEMORY_ASPEN_ATLAS.md",\n)\nLEGAL_REQUIRED_PATHS = (\n    "scripts/validate_legal_case.py",\n    "tests/test_legal_case.py",\n    "domains/legal_case.md",\n    "status/LEGAL_CASE_ATLAS.md",\n)\nCATEGORY_REQUIRED_PATHS = (\n''',
          )
          replace_once(
              adapter,
              '''def category_surface_state(workspace: Path) -> str:\n''',
              '''def legal_surface_state(workspace: Path) -> str:\n    present = [path for path in LEGAL_REQUIRED_PATHS if (workspace / path).is_file()]\n    if not present:\n        return "absent"\n    if len(present) == len(LEGAL_REQUIRED_PATHS):\n        return "complete"\n    return "partial"\n\n\ndef category_surface_state(workspace: Path) -> str:\n''',
          )
          replace_once(
              adapter,
              '''    include_connectors: bool = True,\n    include_memory: bool = True,\n) -> list[list[str]]:\n''',
              '''    include_connectors: bool = True,\n    include_memory: bool = True,\n    include_legal: bool = True,\n) -> list[list[str]]:\n''',
          )
          replace_once(
              adapter,
              '''    if include_category_heads:\n        compile_targets.extend(\n''',
              '''    if include_legal:\n        compile_targets.extend(\n            [\n                "scripts/validate_legal_case.py",\n                "tests/test_legal_case.py",\n            ]\n        )\n    if include_category_heads:\n        compile_targets.extend(\n''',
          )
          replace_once(
              adapter,
              '''    if include_category_heads:\n        sequence.extend(\n''',
              '''    if include_legal:\n        sequence.extend(\n            [\n                [str(python), "scripts/validate_legal_case.py"],\n                [\n                    str(python),\n                    "-m",\n                    "unittest",\n                    "discover",\n                    "-s",\n                    "tests",\n                    "-p",\n                    "test_legal_case.py",\n                ],\n            ]\n        )\n\n    if include_category_heads:\n        sequence.extend(\n''',
          )
          replace_once(
              adapter,
              '''        category_state = category_surface_state(workspace_root)\n''',
              '''        legal_state = legal_surface_state(workspace_root)\n        if legal_state == "partial":\n            missing_legal = [\n                path\n                for path in LEGAL_REQUIRED_PATHS\n                if not (workspace_root / path).is_file()\n            ]\n            return catalog.write_result(\n                plan,\n                result_path,\n                "blocked",\n                reason=(\n                    "partial legal-case surface is not verifiable; missing: "\n                    + ", ".join(missing_legal)\n                ),\n            )\n\n        category_state = category_surface_state(workspace_root)\n''',
          )
          replace_once(
              adapter,
              '''        include_memory = memory_state == "complete"\n        include_category_heads = category_state == "complete"\n        sequence = commands(\n            result_path,\n            str(plan["job_id"]),\n            include_category_heads,\n            include_connectors,\n            include_memory,\n        )\n''',
              '''        include_memory = memory_state == "complete"\n        include_legal = legal_state == "complete"\n        include_category_heads = category_state == "complete"\n        sequence = commands(\n            result_path,\n            str(plan["job_id"]),\n            include_category_heads,\n            include_connectors,\n            include_memory,\n            include_legal,\n        )\n''',
          )
          replace_once(
              adapter,
              '''    if include_memory:\n        gates.append("memory-aspen-atlas")\n    if include_category_heads:\n''',
              '''    if include_memory:\n        gates.append("memory-aspen-atlas")\n    if include_legal:\n        gates.append("legal-case-atlas")\n    if include_category_heads:\n''',
          )

          schema = 'domains/code/schemas/monolith-atlases-result.schema.json'
          replace_once(schema, '"steps": {"type": "array", "maxItems": 18}', '"steps": {"type": "array", "maxItems": 20}')
          replace_once(schema, '"maxItems": 5,\n      "items": {"type": "string", "maxLength": 64}', '"maxItems": 6,\n      "items": {"type": "string", "maxLength": 64}')

          tests = 'tests/test_monolith_atlas_optional_category.py'
          replace_once(tests, '    assert len(sequence) == 17\n', '    assert len(sequence) == 19\n')
          replace_once(
              tests,
              '''    assert any("test_memory_aspen.py" in command for command in sequence)\n    assert any("scripts/validate_category_heads.py" in command for command in sequence)\n''',
              '''    assert any("test_memory_aspen.py" in command for command in sequence)\n    assert any("scripts/validate_legal_case.py" in command for command in sequence)\n    assert any("test_legal_case.py" in command for command in sequence)\n    assert any("scripts/validate_category_heads.py" in command for command in sequence)\n''',
          )
          replace_once(tests, 'adapter.commands(result, "CoreOnly01", False, False, False)', 'adapter.commands(result, "CoreOnly01", False, False, False, False)')
          replace_once(
              tests,
              '''    assert not any("test_memory_aspen.py" in command for command in sequence)\n    assert not any(\n        "scripts/validate_category_heads.py" in command for command in sequence\n    )\n''',
              '''    assert not any("test_memory_aspen.py" in command for command in sequence)\n    assert not any("scripts/validate_legal_case.py" in command for command in sequence)\n    assert not any("test_legal_case.py" in command for command in sequence)\n    assert not any(\n        "scripts/validate_category_heads.py" in command for command in sequence\n    )\n''',
          )
          replace_once(tests, 'adapter.commands(result, "ConnectorGate01", False, True, False)', 'adapter.commands(result, "ConnectorGate01", False, True, False, False)')
          replace_once(tests, 'adapter.commands(result, "MemoryGate01", False, False, True)', 'adapter.commands(result, "MemoryGate01", False, False, True, False)')
          replace_once(
              tests,
              '''def test_connector_surface_state_distinguishes_absent_partial_complete(\n''',
              '''def test_commands_support_legal_without_other_optional_gates(tmp_path: Path) -> None:\n    result = tmp_path / "result.json"\n\n    sequence = adapter.commands(result, "LegalGate01", False, False, False, True)\n\n    assert len(sequence) == 13\n    assert any("scripts/validate_legal_case.py" in command for command in sequence)\n    assert any("test_legal_case.py" in command for command in sequence)\n    assert not any("scripts/validate_connector_fabric.py" in command for command in sequence)\n    assert not any("scripts/validate_memory_aspen.py" in command for command in sequence)\n    assert not any("scripts/validate_category_heads.py" in command for command in sequence)\n\n\ndef test_connector_surface_state_distinguishes_absent_partial_complete(\n''',
          )
          replace_once(
              tests,
              '''def test_category_surface_state_distinguishes_absent_partial_complete(\n''',
              '''def test_legal_surface_state_distinguishes_absent_partial_complete(\n    tmp_path: Path,\n) -> None:\n    assert adapter.legal_surface_state(tmp_path) == "absent"\n\n    first = tmp_path / adapter.LEGAL_REQUIRED_PATHS[0]\n    first.parent.mkdir(parents=True, exist_ok=True)\n    first.write_text("fixture\\n", encoding="utf-8")\n    assert adapter.legal_surface_state(tmp_path) == "partial"\n\n    for relative in adapter.LEGAL_REQUIRED_PATHS[1:]:\n        path = tmp_path / relative\n        path.parent.mkdir(parents=True, exist_ok=True)\n        path.write_text("fixture\\n", encoding="utf-8")\n    assert adapter.legal_surface_state(tmp_path) == "complete"\n\n\ndef test_category_surface_state_distinguishes_absent_partial_complete(\n''',
          )
          replace_once(
              tests,
              '''def test_partial_category_surface_blocks_before_execution(\n''',
              '''def test_partial_legal_surface_blocks_before_execution(\n    tmp_path: Path,\n    monkeypatch,\n) -> None:\n    workspace = tmp_path / "workspace"\n    workspace.mkdir()\n    for relative in adapter.CORE_REQUIRED_PATHS:\n        path = workspace / relative\n        path.parent.mkdir(parents=True, exist_ok=True)\n        path.write_text("fixture\\n", encoding="utf-8")\n    partial = workspace / adapter.LEGAL_REQUIRED_PATHS[0]\n    partial.parent.mkdir(parents=True, exist_ok=True)\n    partial.write_text("fixture\\n", encoding="utf-8")\n\n    monkeypatch.setenv("APEX_RESOLVED_SOURCE_SHA", "a" * 40)\n    monkeypatch.setattr(adapter, "open_checkout", lambda *_args, **_kwargs: _checkout_for(workspace))\n    monkeypatch.setattr(adapter, "build_environment", lambda *_args, **_kwargs: {})\n    monkeypatch.setattr(adapter, "attest_checkout", lambda *_args, **_kwargs: _attestation())\n\n    result_path = tmp_path / "result.json"\n    assert adapter.run(_plan("PartialLegal01"), workspace, result_path) == 2\n    payload = json.loads(result_path.read_text(encoding="utf-8"))\n    assert payload["status"] == "blocked"\n    assert "partial legal-case surface" in payload["reason"]\n\n\ndef test_partial_category_surface_blocks_before_execution(\n''',
          )

          specialized = 'tests/test_specialized_monolith_runners.py'
          replace_once(specialized, '    assert len(sequence) == 17\n', '    assert len(sequence) == 19\n')
          replace_once(
              specialized,
              '''    assert any("test_memory_aspen.py" in command for command in sequence)\n    assert any("scripts/validate_category_heads.py" in command for command in sequence)\n''',
              '''    assert any("test_memory_aspen.py" in command for command in sequence)\n    assert any("scripts/validate_legal_case.py" in command for command in sequence)\n    assert any("test_legal_case.py" in command for command in sequence)\n    assert any("scripts/validate_category_heads.py" in command for command in sequence)\n''',
          )
          PY

          python -m pip install --disable-pip-version-check ruff==0.16.1 pytest==9.1.1
          ruff format domains/code/adapters/monolith_atlas_validate.py tests/test_monolith_atlas_optional_category.py tests/test_specialized_monolith_runners.py
          ruff check domains/code/adapters/monolith_atlas_validate.py tests/test_monolith_atlas_optional_category.py tests/test_specialized_monolith_runners.py
          python -m pytest -q tests/test_monolith_atlas_optional_category.py tests/test_specialized_monolith_runners.py
          python -m json.tool domains/code/schemas/monolith-atlases-result.schema.json >/dev/null
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' \
            domains/code/adapters/monolith_atlas_validate.py \
            domains/code/schemas/monolith-atlases-result.schema.json \
            tests/test_monolith_atlas_optional_category.py \
            tests/test_specialized_monolith_runners.py | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Remove evolver and commit exact scope
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-add-monolith-legal-gate.yml
          git add \
            domains/code/adapters/monolith_atlas_validate.py \
            domains/code/schemas/monolith-atlases-result.schema.json \
            tests/test_monolith_atlas_optional_category.py \
            tests/test_specialized_monolith_runners.py
          git diff --cached --name-only | sort > /tmp/staged.txt
          printf '%s\n' \
            .github/workflows/one-shot-add-monolith-legal-gate.yml \
            domains/code/adapters/monolith_atlas_validate.py \
            domains/code/schemas/monolith-atlases-result.schema.json \
            tests/test_monolith_atlas_optional_category.py \
            tests/test_specialized_monolith_runners.py | sort > /tmp/expected-staged.txt
          diff -u /tmp/expected-staged.txt /tmp/staged.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'evolve(runner): add optional Legal Case atlas proof'
          git push origin HEAD:evolve/monolith-legal-function-gate-20260808
