name: OIDC Review Hardening Patch

on:
  push:
    branches: [fix/keymaster-oidc-public-runner]
    paths:
      - .github/workflows/review-hardening-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/keymaster-oidc-public-runner
          persist-credentials: true
          fetch-depth: 0
      - name: Apply review hardening
        run: python3 scripts/apply_review_hardening.py
      - name: Verify patch
        run: |
          git diff --check
          python3 -m py_compile scripts/action_face_selftest.py tests/test_apex_job_ingress_exclusivity.py scripts/keymaster_oidc_token.py
      - name: Commit review hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/action_face_selftest.py tests/test_apex_job_ingress_exclusivity.py
          git commit -m 'test: bind OIDC repositories to exact authority'
          git push origin HEAD:fix/keymaster-oidc-public-runner
