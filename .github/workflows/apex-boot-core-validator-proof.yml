name: APEX Boot-Core Validator Proof

on:
  push:
    branches:
      - apex/boot-core-exact-validator-20260815
    paths:
      - .github/workflows/apex-boot-core-validator-proof.yml

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apex/boot-core-exact-validator-20260815
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Compile action face and adapter
        run: |
          python -m py_compile \
            scripts/action_face_catalog_runner.py \
            scripts/action_face_job.py \
            domains/code/adapters/apex_boot_core_validate.py

      - name: Verify deterministic registration state
        run: python scripts/apply_apex_boot_core_validator_registration.py

      - name: Run domain registry tests
        run: python -m pytest -q tests/test_domain_registry.py

      - name: Validate boot-core job schema with representative exact-SHA job
        shell: bash
        run: |
          cat > /tmp/apex-boot-core-job.json <<'JSON'
          {
            "job_id": "apex-boot-core-proof",
            "pillar": "C",
            "action": "code.apex-boot-core.validate",
            "source_ref": "66152c9cdafe95fc539146de737538d59c8404ef"
          }
          JSON
          python scripts/action_face_job.py \
            --job /tmp/apex-boot-core-job.json \
            --actions-index registry/actions-index.json \
            --token-profiles config/token-profiles.json \
            --strict

      - name: Write proof receipt
        shell: bash
        run: |
          mkdir -p receipts
          checked_sha="$(git rev-parse HEAD)"
          cat > receipts/apex-boot-core-validator-registration.json <<JSON
          {
            "schema": "glaciereq.apex-boot-core-validator-registration-receipt.v1",
            "status": "PASSED",
            "checked_source_sha": "$checked_sha",
            "action": "code.apex-boot-core.validate",
            "target_repository": "GlacierEQ/apex-boot-core",
            "token_profile": "code_read_only",
            "private_source_read": true,
            "external_mutation": false
          }
          JSON
          git config user.name "GlacierEQ APEX Runner"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/apex-boot-core-validator-registration.json
          git commit -m "Receipt: APEX boot-core validator registration passed"
          git push origin HEAD:apex/boot-core-exact-validator-20260815
