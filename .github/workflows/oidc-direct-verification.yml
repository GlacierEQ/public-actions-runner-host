name: OIDC Direct Verification

on:
  push:
    branches: [fix/keymaster-oidc-public-runner]
    paths:
      - .github/workflows/oidc-direct-verification.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/keymaster-oidc-public-runner
          persist-credentials: false
      - name: Run canonical repository verification
        run: bash -euo pipefail scripts/ci/public-action-face-ci.sh
