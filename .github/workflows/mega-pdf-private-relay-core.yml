name: MEGA-PDF Private Relay Core

on:
  workflow_call:
    inputs:
      source_ref:
        description: Private MEGA-PDF branch, tag, or commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe-private-mega-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SOURCE_REPO: GlacierEQ/MEGA-PDF
      SOURCE_REF: ${{ inputs.source_ref }}
      PYTHONPATH: .
    outputs:
      source_sha: ${{ steps.bind.outputs.source_sha }}

    steps:
      - name: Checkout public action face
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Map public action-face alignment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APEX_EXECUTION_REPO: GlacierEQ/public-actions-runner-host
          APEX_EXPECTED_VISIBILITY: public
        run: python3 scripts/action_face_alignment.py

      - name: Require GitHub App bridge configuration
        env:
          APP_CLIENT_ID: ${{ vars.APEX_RUNNER_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APEX_RUNNER_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_CLIENT_ID" || { echo "APEX_RUNNER_APP_CLIENT_ID is required" >&2; exit 1; }
          test -n "$APP_PRIVATE_KEY" || { echo "APEX_RUNNER_APP_PRIVATE_KEY is required" >&2; exit 1; }
          case "$APP_PRIVATE_KEY" in
            *"BEGIN "*"PRIVATE KEY"*) ;;
            *) echo "APEX_RUNNER_APP_PRIVATE_KEY is not a PEM private key" >&2; exit 1 ;;
          esac

      - name: Mint repository-scoped MEGA-PDF token
        id: mega-pdf-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APEX_RUNNER_APP_CLIENT_ID }}
          private-key: ${{ secrets.APEX_RUNNER_APP_PRIVATE_KEY }}
          owner: GlacierEQ
          repositories: GlacierEQ/MEGA-PDF
          permission-contents: read

      - name: Checkout selected private MEGA-PDF source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ steps.mega-pdf-token.outputs.token }}
          path: workload
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact private source commit
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qiE 'extraheader|authorization|x-access-token|ghs_' workload/.git/config
          rm -rf workload/.git/hooks
          source_sha="$(git -C workload rev-parse HEAD)"
          test -n "$source_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Revoke read-only MEGA-PDF token before workload execution
        if: always() && steps.mega-pdf-token.outputs.token != ''
        env:
          GITHUB_INSTALLATION_TOKEN: ${{ steps.mega-pdf-token.outputs.token }}
        run: python3 scripts/revoke_github_installation_token.py

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install focused verification dependency
        working-directory: workload
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: pytest==8.3.5

      - name: Compile governed control plane
        working-directory: workload
        run: python -m compileall -q mega_pdf_control_plane

      - name: Run focused governance and ingestion tests
        working-directory: workload
        run: >-
          python -m pytest -q
          tests/test_mega_pdf_control_plane.py
          tests/test_function_genome_ingestion.py

      - name: Ingest real private monorepo Function Genome
        working-directory: workload
        run: >-
          mkdir -p ../candidate-mega-pdf/artifacts &&
          python -m mega_pdf_control_plane.function_genome
          --root .
          --output ../candidate-mega-pdf/artifacts/function-genome.json
          --receipts ../candidate-mega-pdf/artifacts/probe-receipts.jsonl
          --summary ../candidate-mega-pdf/artifacts/function-genome-summary.md

      - name: Verify generated outputs with trusted host validator
        env:
          SOURCE_SHA: ${{ steps.bind.outputs.source_sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from domains.code.adapters.mega_pdf_function_genome import (
              collect_payload,
              verify_generated_outputs,
          )

          root = Path("candidate-mega-pdf")
          sha = os.environ["SOURCE_SHA"]
          verify_generated_outputs(root, sha)
          collect_payload(root, sha)
          (root / "artifacts" / "relay-receipt.json").unlink(missing_ok=True)
          PY

      - name: Upload bounded candidate Function Genome artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mega-pdf-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate-mega-pdf/artifacts/function-genome.json
            candidate-mega-pdf/artifacts/probe-receipts.jsonl
            candidate-mega-pdf/artifacts/function-genome-summary.md
          if-no-files-found: error
          retention-days: 1

  publish-private-mega-pdf:
    needs: probe-private-mega-pdf
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SOURCE_REPO: GlacierEQ/MEGA-PDF
      SOURCE_REF: ${{ inputs.source_ref }}
      RESULT_BRANCH: automation/mega-pdf-function-genome-results
      PYTHONPATH: .

    steps:
      - name: Checkout trusted public action face
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Download candidate Function Genome artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: mega-pdf-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-mega-pdf/artifacts

      - name: Verify candidate artifacts before minting write token
        env:
          SOURCE_SHA: ${{ needs.probe-private-mega-pdf.outputs.source_sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from domains.code.adapters.mega_pdf_function_genome import (
              collect_payload,
              verify_generated_outputs,
          )

          root = Path("candidate-mega-pdf")
          sha = os.environ["SOURCE_SHA"]
          verify_generated_outputs(root, sha)
          collect_payload(root, sha)
          PY

      - name: Mint post-execution MEGA-PDF write token
        id: mega-pdf-write-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APEX_RUNNER_APP_CLIENT_ID }}
          private-key: ${{ secrets.APEX_RUNNER_APP_PRIVATE_KEY }}
          owner: GlacierEQ
          repositories: GlacierEQ/MEGA-PDF
          permission-contents: write

      - name: Publish verified artifacts to dedicated private results branch
        id: publish_results
        env:
          GITHUB_INSTALLATION_TOKEN: ${{ steps.mega-pdf-write-token.outputs.token }}
          SOURCE_SHA: ${{ needs.probe-private-mega-pdf.outputs.source_sha }}
        run: |
          python scripts/mega_pdf_relay_publish.py \
            --output-root candidate-mega-pdf \
            --source-ref "$SOURCE_REF" \
            --source-sha "$SOURCE_SHA" \
            --result-branch "$RESULT_BRANCH" \
            --summary-out "$GITHUB_STEP_SUMMARY"

      - name: Revoke post-execution MEGA-PDF write token
        if: always() && steps.mega-pdf-write-token.outputs.token != ''
        id: revoke_write_token
        continue-on-error: true
        env:
          GITHUB_INSTALLATION_TOKEN: ${{ steps.mega-pdf-write-token.outputs.token }}
        run: python3 scripts/revoke_github_installation_token.py

      - name: Enforce write token revocation
        if: always() && steps.mega-pdf-write-token.outputs.token != '' && steps.revoke_write_token.outcome != 'success'
        run: exit 1
