name: Recover deleted GlacierEQ repositories

on:
  push:
    paths:
      - scripts/recover_deleted_glaciereq_repos.py
      - .github/workflows/recover-deleted-glaciereq-repos.yml
  pull_request:
    paths:
      - scripts/recover_deleted_glaciereq_repos.py
      - .github/workflows/recover-deleted-glaciereq-repos.yml
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: repository-recovery
  cancel-in-progress: false

jobs:
  verify-recovery-script:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Compile recovery script
        run: python3 -m py_compile scripts/recover_deleted_glaciereq_repos.py

      - name: Install pinned pytest
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: pytest==8.3.5

      - name: Run recovery unit tests without secrets
        run: python3 -m pytest -q tests/test_repository_recovery.py

  recover-and-reactivate:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: repository-recovery
    permissions:
      contents: read
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_TOKEN: ${{ github.token }}
      RECOVERY_RECEIPT: repo-recovery-receipt.json
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify recovery credential path
        shell: bash
        run: |
          if [ -n "${GH_PAT:-}" ]; then
            echo "Recovery credential: GH_PAT present"
          else
            echo "Recovery credential: GH_PAT absent; repository-scoped GITHUB_TOKEN will only provide detection and may not permit cross-repository activation"
          fi

      - name: Activate every restored casualty at full history strength
        run: python3 scripts/recover_deleted_glaciereq_repos.py

      - name: Publish recovery receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glaciereq-repository-recovery-${{ github.run_id }}
          path: repo-recovery-receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Recovery summary
        if: always()
        shell: bash
        run: |
          if [ -f repo-recovery-receipt.json ]; then
            python3 - <<'PY'
          import json, os
          with open('repo-recovery-receipt.json', encoding='utf-8') as src:
              d = json.load(src)
          counts = d.get('counts', {})
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('# GlacierEQ repository recovery\n\n')
              f.write(f"Casualties tracked: **{d.get('casualty_count')}**\n\n")
              for k, v in sorted(counts.items()):
                  f.write(f"- `{k}`: **{v}**\n")
              f.write('\nThe workflow never deletes, force-pushes, overwrites, or recreates a missing repository. It preserves original Git history and activates repositories after GitHub restoration.\n')
          PY
          fi
