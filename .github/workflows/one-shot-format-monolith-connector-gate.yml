name: One-shot format Monolith connector gate

on:
  push:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: evolve/monolith-connector-function-gate-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Format and verify owned files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check ruff==0.16.1
          ruff format domains/code/adapters/monolith_atlas_validate.py tests/test_monolith_atlas_optional_category.py
          ruff check domains/code/adapters/monolith_atlas_validate.py tests/test_monolith_atlas_optional_category.py
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' \
            domains/code/adapters/monolith_atlas_validate.py \
            tests/test_monolith_atlas_optional_category.py | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Remove formatter and commit exact scope
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-format-monolith-connector-gate.yml
          git add domains/code/adapters/monolith_atlas_validate.py tests/test_monolith_atlas_optional_category.py
          git diff --cached --name-only | sort > /tmp/staged.txt
          printf '%s\n' \
            .github/workflows/one-shot-format-monolith-connector-gate.yml \
            domains/code/adapters/monolith_atlas_validate.py \
            tests/test_monolith_atlas_optional_category.py | sort > /tmp/expected-staged.txt
          diff -u /tmp/expected-staged.txt /tmp/staged.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(runner): apply Ruff formatting to connector gate'
          git push origin HEAD:evolve/monolith-connector-function-gate-20260808
