name: APEX Public Action Face

on:
  issues:
    types: [opened]
  push:
    branches: [main]
  repository_dispatch:
    types:
      - case-evidence
      - document-processing
      - coding-deploy
      - evolution-optimize
      - memory-sync
      - infra-gateway
      - case-ops
      - orchestrate
      - intl-case-ops
      - media-queue
      - whisperx-exec
      - gateway-ci
      - comet-agent-ci
      - apex-verification
  workflow_dispatch:
    inputs:
      pillar:
        description: Pillar A-I
        required: true
        type: choice
        options: [A, B, C, D, E, F, G, H, I]
      action:
        description: Cataloged public action; leave blank for an allowlisted base task
        required: false
        type: string
      job_id:
        description: Opaque job identifier
        required: true
        type: string
      source_repo:
        description: Approved GlacierEQ workload repository for a base task
        required: false
        default: ""
        type: string
      source_ref:
        description: Source branch, tag, or commit
        required: true
        default: main
        type: string
      task:
        description: Allowlisted base operation; ignored when action is set
        required: false
        default: validate
        type: choice
        options: [validate, hash-manifest, test, build, audit]
      approval_id:
        description: Private approval ID required for pillars G and I
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: apex-public-${{ github.event.client_payload.job_id || inputs.job_id || github.event.issue.number || github.sha }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, 'dispatch:')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APEX_EXECUTION_REPO: GlacierEQ/public-actions-runner-host
      APEX_EXPECTED_VISIBILITY: public
      APEX_CONTROL_REPO: GlacierEQ/llm-runner-teams
      APEX_CONTROL_AVAILABLE: ${{ (secrets.APEX_CONTROL_TOKEN != '' || secrets.GH_PAT != '') && 'true' || 'false' }}

    steps:
      - name: Checkout public action face
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Assert canonical public action face
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/action_face_guard.py

      - name: Validate and normalize job
        id: plan
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            python3 scripts/action_face_issue_plan.py
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python3 scripts/action_face_push_plan.py
          else
            python3 scripts/action_face_plan.py \
              --event "$GITHUB_EVENT_PATH" \
              --pillar "${{ inputs.pillar }}" \
              --action "${{ inputs.action }}" \
              --job-id "${{ inputs.job_id }}" \
              --source-repo "${{ inputs.source_repo }}" \
              --source-ref "${{ inputs.source_ref }}" \
              --task "${{ inputs.task }}" \
              --approval-id "${{ inputs.approval_id }}"
          fi

      - name: Verify private dual-confirmation record
        if: steps.plan.outputs.pillar == 'G' || steps.plan.outputs.pillar == 'I'
        env:
          APEX_CONTROL_TOKEN: ${{ secrets.APEX_CONTROL_TOKEN || secrets.GH_PAT }}
        run: |
          python3 scripts/apex_pillar_runner.py verify-approval \
            --job-id "${{ steps.plan.outputs.job_id }}" \
            --pillar "${{ steps.plan.outputs.pillar }}" \
            --approval-id "${{ steps.plan.outputs.approval_id }}"

      - name: Checkout workload without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.plan.outputs.source_repo }}
          ref: ${{ steps.plan.outputs.source_ref }}
          token: ${{ secrets.APEX_PRIVATE_READ_TOKEN || secrets.GH_PAT || github.token }}
          path: workload
          fetch-depth: 1
          persist-credentials: false

      - name: Execute public action adapter
        id: runner
        continue-on-error: true
        run: |
          python3 scripts/action_face_catalog_runner.py \
            .apex-plan.json \
            workload \
            ".apex-results/${{ steps.plan.outputs.job_id }}.json"

      - name: Return detailed result to private control plane
        if: always() && steps.plan.outcome == 'success' && steps.runner.outcome != 'skipped' && env.APEX_CONTROL_AVAILABLE == 'true'
        env:
          APEX_CONTROL_TOKEN: ${{ secrets.APEX_CONTROL_TOKEN || secrets.GH_PAT }}
        run: |
          python3 scripts/apex_pillar_runner.py publish \
            --job-id "${{ steps.plan.outputs.job_id }}" \
            --result ".apex-results/${{ steps.plan.outputs.job_id }}.json"

      - name: Report unavailable private sink
        if: always() && steps.plan.outcome == 'success' && env.APEX_CONTROL_AVAILABLE != 'true'
        run: |
          echo "Private result return is gated until APEX_CONTROL_TOKEN or GH_PAT is installed."
          echo "Detailed result was not published publicly."

      - name: Update public issue with sanitized status
        if: always() && github.event_name == 'issues' && steps.plan.outcome == 'success'
        uses: actions/github-script@v7
        env:
          JOB_ID: ${{ steps.plan.outputs.job_id }}
          PILLAR: ${{ steps.plan.outputs.pillar }}
          ACTION_NAME: ${{ steps.plan.outputs.action }}
          TASK: ${{ steps.plan.outputs.task }}
          RUNNER_OUTCOME: ${{ steps.runner.outcome }}
        with:
          script: |
            const outcome = process.env.RUNNER_OUTCOME;
            const body = [
              'APEX public action face finished.',
              '',
              `- Job: ${process.env.JOB_ID}`,
              `- Pillar: ${process.env.PILLAR}`,
              `- Action: ${process.env.ACTION_NAME || 'base-task'}`,
              `- Task: ${process.env.TASK}`,
              `- Outcome: ${outcome}`,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Detailed output was returned to the private control plane and was not published here.'
            ].join('\n');
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
            if (outcome === 'success') {
              await github.rest.issues.update({...context.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed'});
            }

      - name: Enforce task result
        if: steps.runner.outcome == 'failure'
        run: exit 1
