name: APEX Public Action Face

on:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - jobs/*.json
  repository_dispatch:
    types:
      - case-evidence
      - document-processing
      - coding-deploy
      - evolution-optimize
      - memory-sync
      - infra-gateway
      - case-ops
      - orchestrate
      - intl-case-ops
      - media-queue
      - whisperx-exec
      - gateway-ci
      - comet-agent-ci
      - apex-verification
      - action-face-canary
  workflow_dispatch:
    inputs:
      pillar:
        description: Pillar A-I
        required: true
        type: choice
        options: [A, B, C, D, E, F, G, H, I]
      action:
        description: Cataloged public action; leave blank for a base task
        required: false
        default: ""
        type: string
      job_id:
        description: Opaque job identifier
        required: true
        type: string
      source_repo:
        description: Catalog-approved workload repository; required only for a base task
        required: false
        default: ""
        type: string
      source_ref:
        description: Source branch, tag, or commit
        required: true
        default: main
        type: string
      task:
        description: Allowlisted base operation; leave blank when action is set
        required: false
        default: ""
        type: string
      approval_id:
        description: Private approval ID required only for pillars G and I
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: apex-public-${{ github.event_name }}-${{ github.event.client_payload.job_id || inputs.job_id || github.event.issue.number || github.sha }}
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
       github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APEX_EXECUTION_REPO: GlacierEQ/public-actions-runner-host
      APEX_EXPECTED_VISIBILITY: public
      APEX_CONTROL_REPO: GlacierEQ/llm-runner-teams

    steps:
      - name: Checkout public action face
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Authorize ingress principal
        id: authorize
        run: python3 scripts/action_face_authorize.py

      - name: Assert canonical public action face
        id: identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/action_face_guard.py

      - name: Require dedicated bridge credentials
        id: credentials
        env:
          APEX_PRIVATE_READ_TOKEN: ${{ secrets.APEX_PRIVATE_READ_TOKEN }}
          APEX_CONTROL_TOKEN: ${{ secrets.APEX_CONTROL_TOKEN }}
        run: |
          test -n "$APEX_PRIVATE_READ_TOKEN" || { echo "APEX_PRIVATE_READ_TOKEN is required" >&2; exit 1; }
          test -n "$APEX_CONTROL_TOKEN" || { echo "APEX_CONTROL_TOKEN is required" >&2; exit 1; }

      - name: Assert private non-executing control plane
        id: control
        env:
          APEX_CONTROL_TOKEN: ${{ secrets.APEX_CONTROL_TOKEN }}
        run: python3 scripts/action_face_control_plane_guard.py

      - name: Validate and normalize strict job envelope
        id: plan
        continue-on-error: true
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            python3 scripts/action_face_issue_plan.py
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python3 scripts/action_face_push_plan.py
          else
            python3 scripts/action_face_plan.py \
              --event "$GITHUB_EVENT_PATH" \
              --pillar "${{ inputs.pillar }}" \
              --action "${{ inputs.action }}" \
              --job-id "${{ inputs.job_id }}" \
              --source-repo "${{ inputs.source_repo }}" \
              --source-ref "${{ inputs.source_ref }}" \
              --task "${{ inputs.task }}" \
              --approval-id "${{ inputs.approval_id }}"
          fi

      - name: Close invalid public issue without execution
        if: always() && github.event_name == 'issues' && steps.plan.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATUS_MODE: rejected
          AUTH_REASON: strict metadata envelope validation failed
        run: python3 scripts/action_face_issue_status.py

      - name: Atomically claim immutable job ID
        if: steps.plan.outcome == 'success'
        id: replay
        continue-on-error: true
        env:
          APEX_CONTROL_TOKEN: ${{ secrets.APEX_CONTROL_TOKEN }}
        run: |
          python3 scripts/apex_pillar_runner.py claim-job \
            --plan .apex-plan.json

      - name: Verify private dual-confirmation record
        if: steps.plan.outcome == 'success' && steps.replay.outcome == 'success' && (steps.plan.outputs.pillar == 'G' || steps.plan.outputs.pillar == 'I')
        id: approval
        continue-on-error: true
        env:
          APEX_CONTROL_TOKEN: ${{ secrets.APEX_CONTROL_TOKEN }}
        run: |
          python3 scripts/apex_pillar_runner.py verify-approval \
            --job-id "${{ steps.plan.outputs.job_id }}" \
            --pillar "${{ steps.plan.outputs.pillar }}" \
            --approval-id "${{ steps.plan.outputs.approval_id }}"

      - name: Checkout catalog-approved workload without persisting credentials
        if: >-
          steps.plan.outcome == 'success' &&
          steps.replay.outcome == 'success' &&
          ((steps.plan.outputs.pillar != 'G' && steps.plan.outputs.pillar != 'I') ||
           steps.approval.outcome == 'success')
        id: checkout
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ steps.plan.outputs.source_repo }}
          ref: ${{ steps.plan.outputs.source_ref }}
          token: ${{ secrets.APEX_PRIVATE_READ_TOKEN }}
          path: workload
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact workload repository and commit
        if: steps.checkout.outcome == 'success'
        id: bind
        continue-on-error: true
        run: |
          python3 scripts/action_face_bind_checkout.py \
            --plan .apex-plan.json \
            --workspace workload

      - name: Execute isolated public action adapter
        if: steps.plan.outcome == 'success' && steps.replay.outcome == 'success' && steps.checkout.outcome == 'success' && steps.bind.outcome == 'success'
        id: runner
        continue-on-error: true
        env:
          APEX_RESOLVED_SOURCE_SHA: ${{ steps.bind.outputs.resolved_source_sha }}
          AKOS_POLICY_SHA256: ${{ secrets.AKOS_POLICY_SHA256 }}
        run: |
          python3 scripts/action_face_catalog_runner.py \
            .apex-plan.json \
            workload \
            ".apex-results/${{ steps.plan.outputs.job_id }}.json"

      - name: Checkout fresh post-run control source
        if: always() && steps.plan.outcome == 'success' && steps.replay.outcome == 'success'
        id: postrun_checkout
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: GlacierEQ/public-actions-runner-host
          ref: ${{ github.sha }}
          token: ${{ github.token }}
          path: .apex-postrun-control
          fetch-depth: 1
          persist-credentials: false

      - name: Verify fresh post-run control checkout
        if: steps.postrun_checkout.outcome == 'success'
        id: postrun_integrity
        continue-on-error: true
        run: |
          test "$(git -C .apex-postrun-control rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C .apex-postrun-control status --porcelain --untracked-files=no)"

      - name: Synthesize governed result when execution did not produce one
        if: always() && steps.plan.outcome == 'success' && steps.replay.outcome == 'success' && steps.postrun_integrity.outcome == 'success'
        id: synthesize
        continue-on-error: true
        env:
          AUTHORIZATION_OUTCOME: ${{ steps.authorize.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          CREDENTIAL_OUTCOME: ${{ steps.credentials.outcome }}
          CONTROL_PLANE_OUTCOME: ${{ steps.control.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          CLAIM_OUTCOME: ${{ steps.replay.outcome }}
          APPROVAL_OUTCOME: ${{ steps.approval.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          BIND_OUTCOME: ${{ steps.bind.outcome }}
          RUNNER_OUTCOME: ${{ steps.runner.outcome }}
          APEX_RESOLVED_SOURCE_SHA: ${{ steps.bind.outputs.resolved_source_sha }}
        run: |
          python3 .apex-postrun-control/scripts/action_face_pipeline_result.py \
            --plan .apex-plan.json \
            --result ".apex-results/${{ steps.plan.outputs.job_id }}.json"

      - name: Verify post-run control and result integrity
        if: always() && steps.synthesize.outcome == 'success'
        id: postrun_guard
        continue-on-error: true
        env:
          APEX_CONTROL_TOKEN: ${{ secrets.APEX_CONTROL_TOKEN }}
        run: |
          python3 .apex-postrun-control/scripts/action_face_postrun_guard.py \
            --runner-root . \
            --control-root .apex-postrun-control \
            --plan .apex-plan.json \
            --result ".apex-results/${{ steps.plan.outputs.job_id }}.json" \
            --job-id "${{ steps.plan.outputs.job_id }}" \
            --resolved-source-sha "${{ steps.bind.outputs.resolved_source_sha }}"

      - name: Return verified detailed result to private control plane
        if: always() && steps.postrun_guard.outcome == 'success'
        id: publish
        continue-on-error: true
        env:
          APEX_CONTROL_TOKEN: ${{ secrets.APEX_CONTROL_TOKEN }}
        run: |
          python3 .apex-postrun-control/scripts/action_face_publish_verified.py \
            --job-id "${{ steps.plan.outputs.job_id }}" \
            --result ".apex-results/${{ steps.plan.outputs.job_id }}.json" \
            --expected-file-sha256 "${{ steps.postrun_guard.outputs.result_file_sha256 }}"

      - name: Publish truthful sanitized issue status
        if: always() && github.event_name == 'issues' && steps.plan.outcome == 'success' && steps.postrun_integrity.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATUS_MODE: result
          JOB_ID: ${{ steps.plan.outputs.job_id }}
          PILLAR: ${{ steps.plan.outputs.pillar }}
          ACTION_NAME: ${{ steps.plan.outputs.action }}
          TASK: ${{ steps.plan.outputs.task }}
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
          RUNNER_OUTCOME: ${{ steps.runner.outcome }}
          PIPELINE_RESULT_OUTCOME: ${{ steps.synthesize.outcome }}
          PIPELINE_RESULT_SYNTHESIZED: ${{ steps.synthesize.outputs.synthesized }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: python3 .apex-postrun-control/scripts/action_face_issue_status.py

      - name: Enforce governed release result
        if: >-
          always() &&
          (steps.plan.outcome == 'failure' ||
           steps.replay.outcome == 'failure' ||
           steps.approval.outcome == 'failure' ||
           steps.checkout.outcome == 'failure' ||
           steps.bind.outcome == 'failure' ||
           steps.runner.outcome != 'success' ||
           steps.postrun_checkout.outcome == 'failure' ||
           steps.postrun_integrity.outcome == 'failure' ||
           steps.synthesize.outcome == 'failure' ||
           steps.synthesize.outputs.synthesized == 'true' ||
           steps.postrun_guard.outcome == 'failure' ||
           steps.publish.outcome == 'failure')
        run: exit 1
