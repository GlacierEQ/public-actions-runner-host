name: APEX Public Action Face

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - jobs/*.json
  push:
    branches: [main]
    paths:
      - jobs/*.json
  repository_dispatch:
    types:
      - case-evidence
      - document-processing
      - coding-deploy
      - evolution-optimize
      - memory-sync
      - infra-gateway
      - case-ops
      - orchestrate
      - intl-case-ops
      - media-queue
      - whisperx-exec
      - gateway-ci
      - comet-agent-ci
      - apex-verification
      - action-face-canary
  workflow_dispatch:
    inputs:
      pillar:
        description: Pillar A-I
        required: true
        type: choice
        options: [A, B, C, D, E, F, G, H, I]
      action:
        description: Cataloged public action; leave blank for a base task
        required: false
        default: ""
        type: string
      job_id:
        description: Opaque job identifier
        required: true
        type: string
      source_repo:
        description: Catalog-approved workload repository; required only for a base task
        required: false
        default: ""
        type: string
      source_ref:
        description: Source branch, tag, or commit
        required: true
        default: main
        type: string
      task:
        description: Allowlisted base operation; leave blank when action is set
        required: false
        default: ""
        type: string
      approval_id:
        description: Private approval ID required only for pillars G and I
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: apex-public-${{ github.event_name }}-${{ github.event.client_payload.job_id || inputs.job_id || github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.user.login == github.repository_owner &&
        github.event.pull_request.author_association == 'OWNER' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APEX_EXECUTION_REPO: GlacierEQ/public-actions-runner-host
      APEX_EXPECTED_VISIBILITY: public
      APEX_CONTROL_REPO: GlacierEQ/llm-runner-teams

    steps:
      - name: Checkout public action face
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Authorize ingress principal
        id: authorize
        run: python3 scripts/action_face_authorize.py

      - name: Map public action-face alignment
        id: identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/action_face_alignment.py

      - name: Validate and normalize strict job envelope
        id: plan
        continue-on-error: true
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python3 scripts/action_face_pull_request_plan.py
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python3 scripts/action_face_push_plan.py
          else
            python3 scripts/action_face_plan.py \
              --event "$GITHUB_EVENT_PATH" \
              --pillar "${{ inputs.pillar }}" \
              --action "${{ inputs.action }}" \
              --job-id "${{ inputs.job_id }}" \
              --source-repo "${{ inputs.source_repo }}" \
              --source-ref "${{ inputs.source_ref }}" \
              --task "${{ inputs.task }}" \
              --approval-id "${{ inputs.approval_id }}"
          fi

      - name: Require GitHub OIDC Keymaster bridge
        if: steps.plan.outcome == 'success'
        id: app_config
        continue-on-error: true
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "GitHub OIDC request URL unavailable" >&2; exit 1; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo "GitHub OIDC request token unavailable" >&2; exit 1; }
          python3 -m py_compile scripts/keymaster_oidc_token.py scripts/action_face_legal_router.py domains/legal/adapters/jefs_docket_acquire.py

      - name: Mint one-repository private control token
        if: steps.plan.outcome == 'success' && steps.app_config.outcome == 'success'
        id: control_token
        continue-on-error: true
        run: |
          python3 scripts/keymaster_oidc_token.py \
            --repository GlacierEQ/llm-runner-teams \
            --permission contents=write \
            --operation public-action-control

      - name: Assert private non-executing control plane
        if: steps.control_token.outcome == 'success'
        id: control
        continue-on-error: true
        env:
          APEX_CONTROL_TOKEN: ${{ steps.control_token.outputs.token }}
        run: python3 scripts/action_face_control_plane_guard.py

      - name: Atomically claim immutable job ID
        if: steps.plan.outcome == 'success' && steps.control.outcome == 'success'
        id: replay
        continue-on-error: true
        env:
          APEX_CONTROL_TOKEN: ${{ steps.control_token.outputs.token }}
        run: |
          python3 scripts/apex_pillar_runner.py claim-job \
            --plan .apex-plan.json

      - name: Verify private dual-confirmation record
        if: steps.plan.outcome == 'success' && steps.replay.outcome == 'success' && (steps.plan.outputs.pillar == 'G' || steps.plan.outputs.pillar == 'I')
        id: approval
        continue-on-error: true
        env:
          APEX_CONTROL_TOKEN: ${{ steps.control_token.outputs.token }}
        run: |
          python3 scripts/apex_pillar_runner.py verify-approval \
            --job-id "${{ steps.plan.outputs.job_id }}" \
            --pillar "${{ steps.plan.outputs.pillar }}" \
            --approval-id "${{ steps.plan.outputs.approval_id }}"

      - name: Mint one-repository private workload token
        if: >-
          steps.plan.outcome == 'success' &&
          steps.replay.outcome == 'success' &&
          ((steps.plan.outputs.pillar != 'G' && steps.plan.outputs.pillar != 'I') ||
           steps.approval.outcome == 'success')
        id: workload_token
        continue-on-error: true
        env:
          APEX_WORKLOAD_REPOSITORY: ${{ steps.plan.outputs.source_repo }}
          APEX_ACTION: ${{ steps.plan.outputs.action }}
        run: |
          permission="contents=read"
          operation="public-action-workload"
          if [ "$APEX_ACTION" = "docket-sync" ]; then
            permission="contents=write"
            operation="jefs-docket-acquisition"
          fi
          python3 scripts/keymaster_oidc_token.py \
            --repository "$APEX_WORKLOAD_REPOSITORY" \
            --permission "$permission" \
            --operation "$operation"

      - name: Checkout catalog-approved workload without persisting credentials
        if: steps.workload_token.outcome == 'success'
        id: checkout
        continue-on-error: true
        env:
          APEX_WORKLOAD_TOKEN: ${{ steps.workload_token.outputs.token }}
        run: |
          python3 scripts/action_face_checkout_workload.py \
            --plan .apex-plan.json \
            --workspace workload

      - name: Bind exact workload repository and commit
        if: steps.checkout.outcome == 'success'
        id: bind
        continue-on-error: true
        run: |
          python3 scripts/action_face_bind_checkout.py \
            --plan .apex-plan.json \
            --workspace workload

      - name: Execute isolated public action adapter
        if: steps.plan.outcome == 'success' && steps.replay.outcome == 'success' && steps.checkout.outcome == 'success' && steps.bind.outcome == 'success'
        id: runner
        continue-on-error: true
        env:
          APEX_RESOLVED_SOURCE_SHA: ${{ steps.bind.outputs.resolved_source_sha }}
          APEX_EVIDENCE_WRITE_TOKEN: ${{ steps.plan.outputs.action == 'docket-sync' && steps.workload_token.outputs.token || '' }}
          AKOS_POLICY_SHA256: ${{ steps.plan.outputs.action == 'akos-echo-policy-ci' && secrets.AKOS_POLICY_SHA256 || '' }}
        run: |
          python3 scripts/action_face_legal_router.py \
            .apex-plan.json \
            workload \
            ".apex-results/${{ steps.plan.outputs.job_id }}.json"

      - name: Checkout fresh post-run control source
        if: always() && steps.plan.outcome == 'success' && steps.replay.outcome == 'success'
        id: postrun_checkout
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: GlacierEQ/public-actions-runner-host
          ref: ${{ github.sha }}
          token: ${{ github.token }}
          path: .apex-postrun-control
          fetch-depth: 1
          persist-credentials: false

      - name: Verify fresh post-run control checkout
        if: steps.postrun_checkout.outcome == 'success'
        id: postrun_integrity
        continue-on-error: true
        run: |
          test "$(git -C .apex-postrun-control rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C .apex-postrun-control status --porcelain --untracked-files=no)"

      - name: Synthesize governed result when execution did not produce one
        if: always() && steps.plan.outcome == 'success' && steps.replay.outcome == 'success' && steps.postrun_integrity.outcome == 'success'
        id: synthesize
        continue-on-error: true
        env:
          AUTHORIZATION_OUTCOME: ${{ steps.authorize.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          CREDENTIAL_OUTCOME: ${{ steps.app_config.outcome }}
          CONTROL_TOKEN_OUTCOME: ${{ steps.control_token.outcome }}
          CONTROL_PLANE_OUTCOME: ${{ steps.control.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          CLAIM_OUTCOME: ${{ steps.replay.outcome }}
          APPROVAL_OUTCOME: ${{ steps.approval.outcome }}
          WORKLOAD_TOKEN_OUTCOME: ${{ steps.workload_token.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          BIND_OUTCOME: ${{ steps.bind.outcome }}
          RUNNER_OUTCOME: ${{ steps.runner.outcome }}
          APEX_RESOLVED_SOURCE_SHA: ${{ steps.bind.outputs.resolved_source_sha }}
        run: |
          python3 .apex-postrun-control/scripts/action_face_pipeline_result.py \
            --plan .apex-plan.json \
            --result ".apex-results/${{ steps.plan.outputs.job_id }}.json"

      - name: Verify post-run control, workload, and result integrity
        if: always() && steps.synthesize.outcome == 'success'
        id: postrun_guard
        continue-on-error: true
        env:
          APEX_CONTROL_TOKEN: ${{ steps.control_token.outputs.token }}
        run: |
          python3 .apex-postrun-control/scripts/action_face_postrun_guard.py \
            --runner-root . \
            --control-root .apex-postrun-control \
            --workload-root workload \
            --plan .apex-plan.json \
            --result ".apex-results/${{ steps.plan.outputs.job_id }}.json" \
            --job-id "${{ steps.plan.outputs.job_id }}" \
            --resolved-source-sha "${{ steps.bind.outputs.resolved_source_sha }}"

      - name: Return verified detailed result to private control plane
        if: always() && steps.postrun_guard.outcome == 'success'
        id: publish
        continue-on-error: true
        env:
          APEX_CONTROL_TOKEN: ${{ steps.control_token.outputs.token }}
        run: |
          python3 .apex-postrun-control/scripts/action_face_publish_verified.py \
            --job-id "${{ steps.plan.outputs.job_id }}" \
            --result ".apex-results/${{ steps.plan.outputs.job_id }}.json" \
            --expected-file-sha256 "${{ steps.postrun_guard.outputs.result_file_sha256 }}"
